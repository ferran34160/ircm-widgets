<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi EFS</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 16px; color: #1a1a1a; background: #fff; font-size: 13px; }
@media (prefers-color-scheme: dark) { body { color: #eee; background: #1c1c1e; } }
.header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
.title { font-size: 17px; font-weight: 700; }
select { font-size: 13px; padding: 6px 11px; border: 1px solid #ccc; border-radius: 7px; background: inherit; color: inherit; cursor: pointer; }
@media (prefers-color-scheme: dark) { select { border-color: #444; } }
.loading, .empty { padding: 30px; text-align: center; color: #888; font-size: 13px; }
.summary { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 16px; font-size: 12.5px; color: #666; }
@media (prefers-color-scheme: dark) { .summary { color: #aaa; } }
.summary b { color: inherit; font-size: 14px; }
.quarters { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.qcard { border: 1px solid #e2e2e2; border-radius: 12px; overflow: hidden; }
@media (prefers-color-scheme: dark) { .qcard { border-color: #3a3a3a; } }
.qhead { background: #f2f5f8; padding: 10px 13px; display: flex; justify-content: space-between; align-items: baseline; }
@media (prefers-color-scheme: dark) { .qhead { background: #26282b; } }
.qtitle { font-size: 13.5px; font-weight: 700; }
.qstat { font-size: 11.5px; color: #888; }
.mrow { padding: 10px 13px; border-top: 1px solid #eee; }
@media (prefers-color-scheme: dark) { .mrow { border-top-color: #333; } }
.mrow:first-of-type { border-top: none; }
.mname { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
.mtag { font-size: 10.5px; font-weight: 500; padding: 1px 7px; border-radius: 8px; }
.mtag.futur { background: #eee; color: #999; }
@media (prefers-color-scheme: dark) { .mtag.futur { background: #333; color: #888; } }
.mtag.manque { background: #FBE6E6; color: #B3312C; }
@media (prefers-color-scheme: dark) { .mtag.manque { background: #3a2222; color: #E8908C; } }
.dacard { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
.dacard:last-child { margin-bottom: 0; }
@media (prefers-color-scheme: dark) { .dacard { background: #232323; border-color: #333; } }
.da-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.da-num { font-weight: 600; font-size: 12.5px; }
.da-montant { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.badge { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 9px; white-space: nowrap; }
.b-cours { background: #FBF0E8; color: #8A4A18; }
.b-pgm   { background: #EAF3FB; color: #0C447C; }
.b-bc    { background: #EAFBF3; color: #0F6E56; }
.b-ann   { background: #F0F0F0; color: #888; text-decoration: line-through; }
@media (prefers-color-scheme: dark) {
  .b-cours { background: #3D2A1A; color: #E0A87C; }
  .b-pgm   { background: #16314A; color: #9FC6EE; }
  .b-bc    { background: #16402F; color: #9FE1CB; }
  .b-ann   { background: #2a2a2a; color: #999; }
}
.da-sub { font-size: 11px; color: #888; margin-top: 4px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 10px; padding: 2px 7px; border-radius: 7px; background: #E8EDF2; color: #5a6572; font-weight: 500; }
@media (prefers-color-scheme: dark) { .chip { background: #2e333a; color: #9aa5b1; } }
.chip.absent { opacity: .35; }
.absent-line { font-size: 11.5px; color: #aaa; font-style: italic; }
.section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #888; margin: 22px 0 10px; }
.warn-box { border: 1px solid #F0D3AE; background: #FDF1E3; border-radius: 10px; padding: 10px 13px; font-size: 12.5px; margin-bottom: 8px; }
@media (prefers-color-scheme: dark) { .warn-box { background: #3D2A1A; border-color: #5a3f24; color: #E0A87C; } }
.libre-item { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid #eee; font-size: 12.5px; }
@media (prefers-color-scheme: dark) { .libre-item { border-top-color: #333; } }
.libre-item:first-child { border-top: none; }
</style>
</head>
<body>
<div class="header">
  <div class="title">Suivi EFS</div>
  <select id="year-filter"></select>
</div>
<div id="container"><div class="loading">Chargement…</div></div>

<script>
// Codes des lignes EFS générées par generer_excels.py (Reference_fournisseur exacte du CSV importé)
const CODE_LABELS = { 'T3001': 'T3001', 'QE009': 'Colis. QE009', 'B3111': 'B3111', 'QE010': 'Colis. QE010', 'CONS2': 'Certificat' };
const CODES_EFS = Object.keys(CODE_LABELS);
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function toMs(g) { if (!g) return 0; if (g > 1e15) return g / 1000; if (g > 1e11) return g; return g * 1000; }
function fmtDate(g) { const ms = toMs(g); if (!ms) return ''; const d = new Date(ms); if (isNaN(d) || d.getFullYear() > 3000) return ''; return d.toLocaleDateString('fr-FR'); }
function fmt(v) { return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v || 0); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function refId(v) { if (v == null) return null; if (typeof v === 'number') return v; if (Array.isArray(v)) return v[1] || null; return null; }
function badgeClass(s) { return s === 'BC reçu' ? 'b-bc' : s === 'Envoyée PGM' ? 'b-pgm' : s === 'Annulée' ? 'b-ann' : 'b-cours'; }
function trimestre(m1a12) { return Math.floor((m1a12 - 1) / 3) + 1; }

let DAS = {}, LIBRES = [], selectedYear = null;
const NOW = new Date();

async function fetchAll() {
  try {
    const [da, cmd] = await Promise.all([
      grist.docApi.fetchTable('Demandes_achat'),
      grist.docApi.fetchTable('Commandes'),
    ]);

    const daInfo = {};
    (da.id || []).forEach((id, i) => {
      daInfo[id] = {
        id,
        num_da: (da.Num_DA || [])[i] || ('DA#' + id),
        statut: (da.Statut || [])[i] || '',
        date_da: (da.Date_DA || [])[i] || null,
        date_pgm: (da.Date_OrderPGM || [])[i] || null,
        date_bc: (da.Date_reception_BC || [])[i] || null,
        num_bc: (da.Num_BC || [])[i] || '',
      };
    });

    const commandes = (cmd.id || []).map((id, i) => ({
      id,
      da: refId((cmd.Demande_achat || [])[i]),
      ref: (cmd.Reference_fournisseur || [])[i] || '',
      montant: (cmd.Montant2 || [])[i] || ((cmd.Prix_unitaire_HT || [])[i] || 0) * ((cmd.Quantite || [])[i] || 1),
      designation: (cmd.Designation2 || [])[i] || '',
    })).filter(c => CODES_EFS.includes(c.ref));

    // Regrouper les commandes EFS par DA
    const parDA = {};
    LIBRES = [];
    commandes.forEach(c => {
      if (!c.da) { LIBRES.push(c); return; }
      if (!parDA[c.da]) parDA[c.da] = [];
      parDA[c.da].push(c);
    });

    DAS = {};
    Object.keys(parDA).forEach(daId => {
      const info = daInfo[daId];
      if (!info) return;   // DA supprimée entre-temps
      const arts = parDA[daId];
      DAS[daId] = {
        ...info,
        codes: [...new Set(arts.map(a => a.ref))],
        montant: arts.reduce((s, a) => s + a.montant, 0),
      };
    });

    buildYearOptions();
    render();
  } catch (e) {
    document.getElementById('container').innerHTML = '<div class="empty">Erreur : ' + esc(e.message) + '</div>';
  }
}

function buildYearOptions() {
  const years = new Set([NOW.getFullYear()]);
  Object.values(DAS).forEach(d => { const ms = toMs(d.date_da); if (ms) years.add(new Date(ms).getFullYear()); });
  const list = [...years].sort((a, b) => b - a);
  if (selectedYear == null || !list.includes(selectedYear)) selectedYear = NOW.getFullYear();
  const sel = document.getElementById('year-filter');
  sel.innerHTML = list.map(y => `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`).join('');
}
document.getElementById('year-filter').addEventListener('change', e => { selectedYear = Number(e.target.value); render(); });

function dacardHtml(d) {
  const chips = CODES_EFS.map(c => `<span class="chip ${d.codes.includes(c) ? '' : 'absent'}">${CODE_LABELS[c]}</span>`).join('');
  let dateLine = 'Créée le ' + fmtDate(d.date_da);
  if (d.statut === 'Envoyée PGM' || d.statut === 'BC reçu') dateLine += ' · Envoyée PGM le ' + fmtDate(d.date_pgm);
  if (d.statut === 'BC reçu') dateLine += ' · BC ' + esc(d.num_bc) + ' reçu le ' + fmtDate(d.date_bc);
  return `
    <div class="dacard">
      <div class="da-top">
        <span class="da-num">${esc(d.num_da)}</span>
        <span class="badge ${badgeClass(d.statut)}">${esc(d.statut)}</span>
        <span class="da-montant">${fmt(d.montant)}</span>
      </div>
      <div class="da-sub">${dateLine}</div>
      <div class="chips">${chips}</div>
    </div>`;
}

function render() {
  const container = document.getElementById('container');
  if (!Object.keys(DAS).length && !LIBRES.length) {
    container.innerHTML = '<div class="empty">Aucune donnée EFS trouvée (codes T3001, QE009, B3111, QE010, CONS2 introuvables dans les commandes).</div>';
    return;
  }

  // DA regroupées par année/mois (via Date_DA) ; celles sans date à part
  const parMois = {};   // 'YYYY-MM' -> [DA...]
  const sansDate = [];
  Object.values(DAS).forEach(d => {
    const ms = toMs(d.date_da);
    if (!ms) { sansDate.push(d); return; }
    const dt = new Date(ms);
    const key = dt.getFullYear() + '-' + (dt.getMonth() + 1);
    if (dt.getFullYear() !== selectedYear) return;
    if (!parMois[key]) parMois[key] = [];
    parMois[key].push(d);
  });

  // Résumé de l'année
  const dasAnnee = Object.values(DAS).filter(d => { const ms = toMs(d.date_da); return ms && new Date(ms).getFullYear() === selectedYear; });
  const totalAnnee = dasAnnee.reduce((s, d) => s + d.montant, 0);
  const nbBC = dasAnnee.filter(d => d.statut === 'BC reçu').length;
  const dernierMoisEcoule = selectedYear === NOW.getFullYear() ? NOW.getMonth() + 1 : 12;

  let html = `<div class="summary">
    <span><b>${fmt(totalAnnee)}</b> engagés en ${selectedYear}</span>
    <span><b>${dasAnnee.length}</b> DA</span>
    <span><b>${nbBC}</b> BC reçu${nbBC > 1 ? 's' : ''}</span>
  </div>`;

  html += '<div class="quarters">';
  for (let t = 1; t <= 4; t++) {
    const moisT = [1, 2, 3].map(k => (t - 1) * 3 + k);
    let subtotal = 0, nbComplet = 0, nbAttendu = 0;
    let rows = '';
    moisT.forEach(m => {
      const key = selectedYear + '-' + m;
      const list = (parMois[key] || []).sort((a, b) => (a.montant < b.montant ? 1 : -1));
      const estFutur = selectedYear > NOW.getFullYear() || (selectedYear === NOW.getFullYear() && m > NOW.getMonth() + 1);
      list.forEach(d => subtotal += d.montant);
      if (!estFutur) {
        nbAttendu++;
        if (list.some(d => d.statut === 'BC reçu')) nbComplet++;
      }
      let tag = '';
      if (!list.length) tag = estFutur ? '<span class="mtag futur">à venir</span>' : '<span class="mtag manque">⚠ Aucune DA</span>';
      rows += `<div class="mrow"><div class="mname">${MOIS[m - 1]}${tag}</div>${
        list.length ? list.map(dacardHtml).join('') : ''
      }</div>`;
    });
    html += `
      <div class="qcard">
        <div class="qhead">
          <span class="qtitle">T${t} · ${MOIS[moisT[0] - 1]}–${MOIS[moisT[2] - 1]}</span>
          <span class="qstat">${fmt(subtotal)} · ${nbComplet}/${nbAttendu || 0} complété${nbComplet > 1 ? 's' : ''}</span>
        </div>
        ${rows}
      </div>`;
  }
  html += '</div>';

  if (sansDate.length) {
    html += `<div class="section-title">DA EFS sans date (${sansDate.length})</div><div class="warn-box">Ces DA n'apparaissent dans aucun trimestre car leur Date_DA est vide.</div>`;
    html += sansDate.map(dacardHtml).join('');
  }

  if (LIBRES.length) {
    const totalLibres = LIBRES.reduce((s, a) => s + a.montant, 0);
    html += `<div class="section-title">Articles EFS non assignés à une DA (${LIBRES.length} · ${fmt(totalLibres)})</div>
      <div class="warn-box">Importés depuis un CSV mais pas encore rattachés à une DA — à assigner via « Gestion DAs ».</div>`;
    html += LIBRES.map(a => `<div class="libre-item"><span>${esc(a.designation)} <span class="chip">${CODE_LABELS[a.ref] || esc(a.ref)}</span></span><span>${fmt(a.montant)}</span></div>`).join('');
  }

  container.innerHTML = html;
}

const gs = document.createElement('script');
gs.src = 'https://docs.getgrist.com/grist-plugin-api.js';
gs.onload = () => { grist.ready({ requiredAccess: 'full' }); fetchAll(); grist.onRecords(fetchAll); };
gs.onerror = () => { document.getElementById('container').innerHTML = '<div class="empty">Grist non disponible.</div>'; };
document.head.appendChild(gs);
</script>
</body>
</html>
