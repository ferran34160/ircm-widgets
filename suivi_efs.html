<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi EFS</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 16px; color: #1a1a1a; background: #fff; font-size: 13px; }
@media (prefers-color-scheme: dark) { body { color: #eee; background: #1c1c1e; } }
.header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
.title { font-size: 17px; font-weight: 700; }
select { font-size: 13px; padding: 6px 11px; border: 1px solid #ccc; border-radius: 7px; background: inherit; color: inherit; cursor: pointer; }
@media (prefers-color-scheme: dark) { select { border-color: #444; } }
.loading, .empty { padding: 30px; text-align: center; color: #888; font-size: 13px; }
.summary { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 16px; font-size: 12.5px; color: #666; }
@media (prefers-color-scheme: dark) { .summary { color: #aaa; } }
.summary b { color: inherit; font-size: 14px; }
/* Grille partagée : 4 colonnes (T1..T4) × 5 lignes (en-tête, image, mois 1, mois 2, mois 3).
   Chaque « ligne logique » est émise pour les 4 trimestres d'affilée : le navigateur aligne
   alors automatiquement la hauteur de chaque ligne sur la plus grande cellule de cette ligne,
   trimestre avec ou sans image / avec plus ou moins d'articles. */
.qgrid { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); column-gap: 14px; row-gap: 0; }
@media (max-width: 900px) { .qgrid { grid-template-columns: repeat(2, minmax(230px, 1fr)); } }
@media (max-width: 480px) { .qgrid { grid-template-columns: 1fr; } }
.qcell { padding: 10px 13px; }
.qhead-cell { display: flex; justify-content: space-between; align-items: baseline; border-radius: 12px 12px 0 0; }
.qtitle { font-size: 13.5px; font-weight: 700; }
.qstat { font-size: 18px; color: inherit; font-weight: 700; font-variant-numeric: tabular-nums; }
.qimg-cell { padding-top: 0; }
.qimg-cell:empty { padding: 0; }
.mrow { border-top: 1px solid rgba(0,0,0,.07); }
@media (prefers-color-scheme: dark) { .mrow { border-top-color: rgba(255,255,255,.08); } }
.qcell.qcell-bottom { border-radius: 0 0 12px 12px; padding-bottom: 13px; }
/* Cellules blanches : la couleur du trimestre reste visible en accent (liseré à gauche),
   pas en aplat sur tout le fond — cohérent avec l'esthétique des cartes de gestion_da. */
.qcell { background: #fff; border-left: 3px solid var(--qc, transparent); }
@media (prefers-color-scheme: dark) { .qcell { background: #202020; } }
.qcolor-1 { --qc: #378ADD; }
.qcolor-2 { --qc: #1D9E75; }
.qcolor-3 { --qc: #D97B3F; }
.qcolor-4 { --qc: #9C6ADE; }
.mname { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
.mtag { font-size: 10.5px; font-weight: 500; padding: 1px 7px; border-radius: 8px; }
.mtag.futur { background: #eee; color: #999; }
@media (prefers-color-scheme: dark) { .mtag.futur { background: #333; color: #888; } }
.mtag.manque { background: #FBE6E6; color: #B3312C; }
@media (prefers-color-scheme: dark) { .mtag.manque { background: #3a2222; color: #E8908C; } }
.dacard { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
.dacard:last-child { margin-bottom: 0; }
@media (prefers-color-scheme: dark) { .dacard { background: #232323; border-color: #333; } }
.da-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.da-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
.da-num { font-weight: 600; font-size: 12.5px; }
.da-montant { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.badge { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 9px; white-space: nowrap; }
.b-cours { background: #FBF0E8; color: #8A4A18; }
.b-pgm   { background: #EAF3FB; color: #0C447C; }
.b-bc    { background: #EAFBF3; color: #0F6E56; }
.b-ann   { background: #F0F0F0; color: #888; text-decoration: line-through; }
@media (prefers-color-scheme: dark) {
  .b-cours { background: #3D2A1A; color: #E0A87C; }
  .b-pgm   { background: #16314A; color: #9FC6EE; }
  .b-bc    { background: #16402F; color: #9FE1CB; }
  .b-ann   { background: #2a2a2a; color: #999; }
}
.da-sub { font-size: 11px; color: #888; margin-top: 4px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 10px; padding: 2px 7px; border-radius: 7px; background: #E8EDF2; color: #5a6572; font-weight: 500; }
@media (prefers-color-scheme: dark) { .chip { background: #2e333a; color: #9aa5b1; } }
.chip.absent { opacity: .35; }
.lignes { margin-top: 7px; }
.ligne-item { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; padding: 3px 0; color: #555; }
@media (prefers-color-scheme: dark) { .ligne-item { color: #bbb; } }
.ligne-item .lm { font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn-bc { font-size: 11px; padding: 3px 10px; border-radius: 7px; border: 1px solid #1D9E75; color: #0F6E56; background: none; cursor: pointer; white-space: nowrap; }
.btn-bc:hover { background: #1D9E75; color: #fff; }
.btn-pj { font-size: 11px; padding: 3px 10px; border-radius: 7px; border: 1px solid #378ADD; color: #0C447C; background: none; cursor: pointer; }
.btn-pj:hover { background: #378ADD; color: #fff; }
@media (prefers-color-scheme: dark) { .btn-pj { color: #9FC6EE; border-color: #378ADD; } .btn-pj:hover { background: #378ADD; color: #16314A; } }
.pj-list { display: none; margin-top: 6px; padding-left: 2px; }
.pj-list.open { display: block; }
.pj-list button { display: block; font-size: 11.5px; padding: 3px 4px; background: none; border: none; color: #378ADD; cursor: pointer; text-align: left; }
.pj-list button:hover { text-decoration: underline; }
@media (prefers-color-scheme: dark) { .pj-list button { color: #9FC6EE; } }
@media (prefers-color-scheme: dark) { .btn-bc { color: #9FE1CB; border-color: #1D9E75; } .btn-bc:hover { background: #1D9E75; color: #16402F; } }
.autres-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.qimg-cell .autres-wrap { margin-top: 0; flex-direction: column; }
.qimg-cell .autres-thumb { width: 100%; height: auto; object-fit: contain; border-radius: 8px; cursor: zoom-in; }
.autres-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 7px; border: 1px solid #ddd; cursor: pointer; background: #f2f2f2; }
@media (prefers-color-scheme: dark) { .autres-thumb { border-color: #444; background: #2a2a2a; } }
.autres-link { font-size: 11px; padding: 3px 10px; border-radius: 7px; border: 1px solid #999; background: none; cursor: pointer; color: inherit; }
.autres-link:hover { background: rgba(128,128,128,.15); }
.absent-line { font-size: 11.5px; color: #aaa; font-style: italic; }
.section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #888; margin: 22px 0 10px; }
.warn-box { border: 1px solid #F0D3AE; background: #FDF1E3; border-radius: 10px; padding: 10px 13px; font-size: 12.5px; margin-bottom: 8px; }
@media (prefers-color-scheme: dark) { .warn-box { background: #3D2A1A; border-color: #5a3f24; color: #E0A87C; } }
.libre-item { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid #eee; font-size: 12.5px; }
@media (prefers-color-scheme: dark) { .libre-item { border-top-color: #333; } }
.libre-item:first-child { border-top: none; }
</style>
</head>
<body>
<div class="header">
  <div class="title">Suivi EFS</div>
  <select id="year-filter"></select>
</div>
<div id="container"><div class="loading">Chargement…</div></div>

<script>
// Codes des lignes EFS générées par generer_excels.py (Reference_fournisseur exacte du CSV importé)
const CODE_LABELS = { 'T3001': 'T3001', 'QE009': 'Colis. QE009', 'B3111': 'B3111', 'QE010': 'Colis. QE010', 'CONS2': 'Certificat' };
const CODES_EFS = Object.keys(CODE_LABELS);
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function toMs(g) { if (!g) return 0; if (g > 1e15) return g / 1000; if (g > 1e11) return g; return g * 1000; }
function fmtDate(g) { const ms = toMs(g); if (!ms) return ''; const d = new Date(ms); if (isNaN(d) || d.getFullYear() > 3000) return ''; return d.toLocaleDateString('fr-FR'); }
function fmt(v) { return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v || 0); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function refId(v) { if (v == null) return null; if (typeof v === 'number') return v; if (Array.isArray(v)) return v[1] || null; return null; }
function badgeClass(s) { return s === 'BC reçu' ? 'b-bc' : s === 'Envoyée PGM' ? 'b-pgm' : s === 'Annulée' ? 'b-ann' : 'b-cours'; }
async function loadAutresThumbs() {
  const imgs = [...document.querySelectorAll('img.autres-thumb[data-attach-id]')];
  if (!imgs.length) return;
  try {
    const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
    imgs.forEach(img => {
      img.src = `${tokenInfo.baseUrl}/attachments/${img.dataset.attachId}/download?auth=${tokenInfo.token}&inline=true`;
    });
  } catch (e) {
    // Pas de vignette possible : chaque image basculera sur son bouton de secours via onerror.
  }
}

function attachIds(v) {
  // Pièces jointes Grist via fetchTable : ['L', id1, id2, ...] ou null/[]
  if (!v) return [];
  if (Array.isArray(v)) {
    if (v[0] === 'L') return v.slice(1).filter(x => typeof x === 'number');
    return v.filter(x => typeof x === 'number');
  }
  return [];
}
// Transforme un nom de fichier généré par generer_excels.py en libellé lisible.
// Formats connus :
//   AAMMJJ_734CT_734ECA_<CODE>_Tx_MM_seq.xlsx      -> bordereau (ex. "T3001 – 06/10/2026")
//   AAMM_734CT_734ECA AAAA_mois_CONS2.xlsx          -> certificat (ex. "Certificat – Octobre 2026")
// Si le nom ne correspond à aucun des deux, on l'affiche tel quel (sans l'extension).
const CODE_RE = /(T3001|B3111|QE009|QE010|CONS2)/i;

function friendlyPjName(raw) {
  if (!raw) return null;
  const nom = String(raw).trim().replace(/\.xlsx?$/i, '');

  // 1) Format exact du script (rapide) : AAMMJJ_734CT_734ECA_CODE_Tx_MM_seq
  let m = nom.match(/(\d{2})(\d{2})(\d{2})_734CT_734ECA_([A-Z0-9]+)_T\d_\d{2}_\d+/);
  if (m) {
    const [, aa, mm, jj, code] = m;
    return `${code} – ${jj}/${mm}/20${aa}`;
  }
  // 1bis) Format exact du certificat : AAMM_734CT_734ECA AAAA_mois_CONS2
  m = nom.match(/(\d{2})(\d{2})_734CT_734ECA \d{4}_([a-zàâäéèêëîïôöùûüç]+)_CONS2/i);
  if (m) {
    const mois = m[3];
    return 'Certificat – ' + mois.charAt(0).toUpperCase() + mois.slice(1).toLowerCase();
  }

  // 2) Repli générique : le nom a pu être modifié à la main (n° de BC inséré, tiret bas
  // remplacé par un espace, etc.) — on cherche juste le code et une date où qu'ils soient,
  // sans exiger un squelette exact.
  const codeM = nom.match(CODE_RE);
  if (codeM) {
    const code = codeM[1].toUpperCase();
    if (code === 'CONS2') {
      const moisM = nom.match(new RegExp('(' + MOIS_KEYS.join('|') + ')', 'i'));
      if (moisM) {
        const mois = moisM[1].toLowerCase();
        return 'Certificat – ' + mois.charAt(0).toUpperCase() + mois.slice(1);
      }
      return 'Certificat';
    }
    // Date complète JJMMAAAA isolée (ni précédée ni suivie d'un autre chiffre, pour ne
    // pas mordre sur un long numéro de BC accolé, ex. « ..._4525154838_13012026_B3111 »).
    let d = nom.match(/(?<!\d)(\d{2})(\d{2})(\d{4})(?!\d)/);
    if (d) return `${code} – ${d[1]}/${d[2]}/${d[3]}`;
    // Sinon, date courte AAMMJJ tout au début du nom (format d'origine du script)
    d = nom.match(/^(\d{2})(\d{2})(\d{2})(?!\d)/);
    if (d) return `${code} – ${d[3]}/${d[2]}/20${d[1]}`;
    return code;
  }

  // 3) Rien de reconnaissable : nom du fichier tel quel
  return nom;
}

function togglePjList(daId) {
  const list = document.getElementById('pj-list-' + daId);
  const btn = document.getElementById('pj-btn-' + daId);
  if (!list || !btn) return;
  list.classList.toggle('open');
  btn.textContent = btn.textContent.replace(list.classList.contains('open') ? '📄' : '📂', list.classList.contains('open') ? '📂' : '📄');
}

function handleImgError(imgEl, attId) {
  const btn = document.createElement('button');
  btn.className = 'autres-link';
  btn.textContent = '🖼 Voir la pièce jointe';
  btn.onclick = () => openAttachment(attId);
  imgEl.replaceWith(btn);
}

async function openAttachment(attId) {
  try {
    const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
    const url = `${tokenInfo.baseUrl}/attachments/${attId}/download?auth=${tokenInfo.token}&inline=true`;
    window.open(url, '_blank');
  } catch (e) {
    alert("Impossible d'ouvrir le fichier : " + e.message);
  }
}

function trimestre(m1a12) { return Math.floor((m1a12 - 1) / 3) + 1; }

// Le mois de suivi d'une DA EFS vient de la Designation de sa ligne CONS2
// (ex. « CERTIFICAT MENSUEL - Juillet 2026 »), pas de sa Date_DA.
const MOIS_KEYS = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
function parseMoisDesignation(desig) {
  if (!desig) return null;
  const txt = String(desig).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  let moisIdx = -1;
  for (let i = 0; i < MOIS_KEYS.length; i++) { if (txt.includes(MOIS_KEYS[i])) { moisIdx = i; break; } }
  if (moisIdx < 0) return null;
  const yearMatch = txt.match(/(20\d{2})/);
  if (!yearMatch) return null;
  return { year: Number(yearMatch[1]), month: moisIdx + 1 };
}

let DAS = {}, LIBRES = [], selectedYear = null;
const NOW = new Date();

const FOURNISSEUR_EFS = 'efs';   // comparaison insensible à la casse/espaces

async function fetchAll() {
  try {
    const [da, cmd, four] = await Promise.all([
      grist.docApi.fetchTable('Demandes_achat'),
      grist.docApi.fetchTable('Commandes'),
      grist.docApi.fetchTable('Fournisseurs'),
    ]);

    const fourNoms = {};
    (four.id || []).forEach((id, i) => { fourNoms[id] = (four.Nom || four.Label || four.Name || [])[i] || ''; });

    const daInfo = {};
    (da.id || []).forEach((id, i) => {
      const fid = refId((da.Fournisseur || [])[i]);
      const fournisseur = fid != null ? (fourNoms[fid] || '') : '';
      daInfo[id] = {
        id,
        num_da: (da.Num_DA || [])[i] || ('DA#' + id),
        statut: (da.Statut || [])[i] || '',
        date_da: (da.Date_DA || [])[i] || null,
        date_pgm: (da.Date_OrderPGM || [])[i] || null,
        date_bc: (da.Date_reception_BC || [])[i] || null,
        num_bc: (da.Num_BC || [])[i] || '',
        bc_ids: attachIds((da.BC || [])[i]),
        pj_ids: attachIds((da.PJ || [])[i]),
        pj_noms: (da.PJ_Noms || [])[i] ? String((da.PJ_Noms || [])[i]).split(' || ') : [],
        autres_ids: attachIds((da.Autres || [])[i]),
        isEFS: String(fournisseur).trim().toLowerCase() === FOURNISSEUR_EFS,
      };
    });

    const commandes = (cmd.id || []).map((id, i) => ({
      id,
      da: refId((cmd.Demande_achat || [])[i]),
      ref: (cmd.Reference_fournisseur || [])[i] || '',
      montant: (cmd.Montant2 || [])[i] || ((cmd.Prix_unitaire_HT || [])[i] || 0) * ((cmd.Quantite || [])[i] || 1),
      qte: (cmd.Quantite || [])[i],
      designation: (cmd.Designation2 || [])[i] || '',
    }));

    // Regrouper TOUTES les commandes d'une DA « EFS » (identifiée par son Fournisseur)
    const parDA = {};
    commandes.forEach(c => {
      if (!c.da || !daInfo[c.da] || !daInfo[c.da].isEFS) return;
      if (!parDA[c.da]) parDA[c.da] = [];
      parDA[c.da].push(c);
    });

    DAS = {};
    Object.keys(parDA).forEach(daId => {
      const info = daInfo[daId];
      const arts = parDA[daId];
      const cons2 = arts.find(a => a.ref === 'CONS2');
      DAS[daId] = {
        ...info,
        lignes: arts,
        autresLignes: arts.filter(a => !CODES_EFS.includes(a.ref)).length,
        montant: arts.reduce((s, a) => s + a.montant, 0),
        moisCible: cons2 ? parseMoisDesignation(cons2.designation) : null,
      };
    });

    // Articles pas encore attachés à une DA : pas de Fournisseur propre, donc repérage
    // provisoire par code (jusqu'à leur assignation via « Gestion DAs »).
    LIBRES = commandes.filter(c => !c.da && CODES_EFS.includes(c.ref));

    buildYearOptions();
    render();
  } catch (e) {
    document.getElementById('container').innerHTML = '<div class="empty">Erreur : ' + esc(e.message) + '</div>';
  }
}

function buildYearOptions() {
  const years = new Set([NOW.getFullYear()]);
  Object.values(DAS).forEach(d => { if (d.moisCible) years.add(d.moisCible.year); });
  const list = [...years].sort((a, b) => b - a);
  if (selectedYear == null || !list.includes(selectedYear)) selectedYear = NOW.getFullYear();
  const sel = document.getElementById('year-filter');
  sel.innerHTML = list.map(y => `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`).join('');
}
document.getElementById('year-filter').addEventListener('change', e => { selectedYear = Number(e.target.value); render(); });

function thumbsHtml(ids) {
  return `<div class="autres-wrap">${ids.map(id =>
    `<img class="autres-thumb" data-attach-id="${id}" onclick="openAttachment(${id})" onerror="handleImgError(this, ${id})" title="Voir la pièce jointe">`
  ).join('')}</div>`;
}

function dacardHtml(d, showAutres = true) {
  let dateLine = '';
  if (d.statut === 'Envoyée PGM' || d.statut === 'BC reçu') dateLine = 'Envoyée PGM le ' + fmtDate(d.date_pgm);
  if (d.statut === 'BC reçu') dateLine += (dateLine ? ' · ' : '') + 'BC ' + esc(d.num_bc) + ' reçu le ' + fmtDate(d.date_bc);

  const lignesHtml = (d.lignes || [])
    .map(a => `<div class="ligne-item"><span>${a.qte != null ? a.qte + '× ' : ''}${esc(a.designation || CODE_LABELS[a.ref] || a.ref)}</span><span class="lm">${fmt(a.montant)}</span></div>`)
    .join('');

  const bcBtn = (d.bc_ids && d.bc_ids.length)
    ? d.bc_ids.map((id, i) => `<button class="btn-bc" onclick="openAttachment(${id})">📎 Voir le BC${d.bc_ids.length > 1 ? ' (' + (i + 1) + ')' : ''}</button>`).join(' ')
    : '';

  // Bordereaux (PJ) : un seul bouton dépliable, plutôt qu'un bouton par fichier (il peut y en avoir 5-6 par DA).
  // Bouton et liste séparés : le bouton reste à côté de « Voir le BC », la liste s'ouvre en dessous des deux.
  const pjBtn = (d.pj_ids && d.pj_ids.length)
    ? `<button class="btn-pj" id="pj-btn-${d.id}" onclick="togglePjList(${d.id})">📄 Bordereaux (${d.pj_ids.length})</button>`
    : '';
  const pjListHtml = (d.pj_ids && d.pj_ids.length)
    ? `<div class="pj-list" id="pj-list-${d.id}">${d.pj_ids.map((id, i) => {
         const label = esc(friendlyPjName(d.pj_noms[i]) || ('Bordereau ' + (i + 1)));
         return `<button onclick="openAttachment(${id})">${label}</button>`;
       }).join('')}</div>`
    : '';

  // Une pièce jointe « Autres » couvre en général tout le trimestre (le calendrier des
  // sessions), pas une seule DA : dans une carte de mois, elle est déjà montrée une fois
  // au niveau du trimestre (voir plus bas) — ici on ne la réaffiche que si showAutres=true
  // (cas des DA « au mois indéterminé », qui n'apparaissent dans aucun trimestre).
  const autresHtml = (showAutres && d.autres_ids && d.autres_ids.length)
    ? thumbsHtml(d.autres_ids)
    : '';

  return `
    <div class="dacard">
      <div class="da-top">
        <div class="da-left">
          <span class="da-num">${esc(d.num_da)}</span>
          <span class="badge ${badgeClass(d.statut)}">${esc(d.statut)}</span>
        </div>
        <span class="da-montant">${fmt(d.montant)}</span>
      </div>
      ${dateLine ? `<div class="da-sub">${dateLine}</div>` : ''}
      <div class="lignes">${lignesHtml}</div>
      ${(bcBtn || pjBtn) ? `<div style="margin-top:7px; display:flex; gap:6px; flex-wrap:wrap;">${bcBtn}${pjBtn}</div>` : ''}
      ${pjListHtml}
      ${autresHtml}
    </div>`;
}

function render() {
  const container = document.getElementById('container');
  if (!Object.keys(DAS).length && !LIBRES.length) {
    container.innerHTML = '<div class="empty">Aucune donnée EFS trouvée (codes T3001, QE009, B3111, QE010, CONS2 introuvables dans les commandes).</div>';
    return;
  }

  // DA regroupées par année/mois DE LA LIGNE CERTIFICAT (pas de la Date_DA) ; les DA EFS
  // sans certificat, ou avec un certificat dont le mois n'a pas pu être lu, à part.
  const parMois = {};   // 'YYYY-MM' -> [DA...]
  const sansDate = [];
  Object.values(DAS).forEach(d => {
    if (!d.moisCible) { sansDate.push(d); return; }
    if (d.moisCible.year !== selectedYear) return;
    const key = d.moisCible.year + '-' + d.moisCible.month;
    if (!parMois[key]) parMois[key] = [];
    parMois[key].push(d);
  });

  // Résumé de l'année
  const dasAnnee = Object.values(DAS).filter(d => d.moisCible && d.moisCible.year === selectedYear);
  const totalAnnee = dasAnnee.reduce((s, d) => s + d.montant, 0);
  const dernierMoisEcoule = selectedYear === NOW.getFullYear() ? NOW.getMonth() + 1 : 12;

  let html = `<div class="summary">
    <span><b>${fmt(totalAnnee)}</b> engagés en ${selectedYear}</span>
  </div>`;

  // Précalcul des 4 trimestres, en gardant en-tête / image / chaque mois séparés :
  // on les recompose ensuite ligne par ligne pour que la grille aligne les hauteurs.
  const quartersData = [];
  for (let t = 1; t <= 4; t++) {
    const moisT = [1, 2, 3].map(k => (t - 1) * 3 + k);
    let subtotal = 0;
    const moisCells = [];
    moisT.forEach((m, mi) => {
      const key = selectedYear + '-' + m;
      const list = (parMois[key] || []).sort((a, b) => (a.montant < b.montant ? 1 : -1));
      const estFutur = selectedYear > NOW.getFullYear() || (selectedYear === NOW.getFullYear() && m > NOW.getMonth() + 1);
      list.forEach(d => subtotal += d.montant);
      let tag = '';
      if (!list.length) tag = estFutur ? '<span class="mtag futur">à venir</span>' : '<span class="mtag manque">⚠ Aucune DA</span>';
      const dernier = mi === 2 ? ' qcell-bottom' : '';
      moisCells.push(`<div class="qcell mrow qcolor-${t}${dernier}"><div class="mname">${MOIS[m - 1]}${tag}</div>${
        list.length ? list.map(d => dacardHtml(d, false)).join('') : ''
      }</div>`);
    });
    // Pièces jointes « Autres » de toutes les DA du trimestre, regroupées et dédoublonnées
    // (même image collée sur plusieurs DA => affichée une seule fois).
    const autresQ = [...new Set(moisT.flatMap(m => (parMois[selectedYear + '-' + m] || []).flatMap(d => d.autres_ids || [])))];
    quartersData.push({
      headerCell: `<div class="qcell qhead-cell qcolor-${t}"><span class="qtitle">T${t} · ${MOIS[moisT[0] - 1]}–${MOIS[moisT[2] - 1]}</span><span class="qstat">${fmt(subtotal)}</span></div>`,
      imageCell: `<div class="qcell qimg-cell qcolor-${t}">${autresQ.length ? thumbsHtml(autresQ) : ''}</div>`,
      moisCells,
    });
  }

  html += '<div class="qgrid">';
  quartersData.forEach(q => html += q.headerCell);
  quartersData.forEach(q => html += q.imageCell);
  for (let mi = 0; mi < 3; mi++) quartersData.forEach(q => html += q.moisCells[mi]);
  html += '</div>';

  if (sansDate.length) {
    html += `<div class="section-title">DA EFS au mois indéterminé (${sansDate.length})</div>
      <div class="warn-box">Le mois n'a pas pu être lu sur la ligne « CONS2 » (absente, ou désignation sans mois + année reconnaissables — ex. attendu : « CERTIFICAT MENSUEL - Juillet 2026 »).</div>`;
    html += sansDate.map(d => dacardHtml(d)).join('');
  }

  if (LIBRES.length) {
    const totalLibres = LIBRES.reduce((s, a) => s + a.montant, 0);
    html += `<div class="section-title">Articles EFS non assignés à une DA (${LIBRES.length} · ${fmt(totalLibres)})</div>
      <div class="warn-box">Importés depuis un CSV mais pas encore rattachés à une DA — à assigner via « Gestion DAs ».</div>`;
    html += LIBRES.map(a => `<div class="libre-item"><span>${esc(a.designation)} <span class="chip">${CODE_LABELS[a.ref] || esc(a.ref)}</span></span><span>${fmt(a.montant)}</span></div>`).join('');
  }

  container.innerHTML = html;
  loadAutresThumbs();
}

const gs = document.createElement('script');
gs.src = 'https://docs.getgrist.com/grist-plugin-api.js';
gs.onload = () => { grist.ready({ requiredAccess: 'full' }); fetchAll(); grist.onRecords(fetchAll); };
gs.onerror = () => { document.getElementById('container').innerHTML = '<div class="empty">Grist non disponible.</div>'; };
document.head.appendChild(gs);
</script>
<script>
/* FIX-PREMIER-CLIC: si le widget se re-dessine (focus / onRecords) entre l'appui et le relâchement
   de la souris, le clic se perdait. On le rejoue sur l'élément équivalent du nouveau DOM. */
(function(){
  var down=null;
  function pathOf(el){var p=[];while(el&&el!==document.body&&el.parentNode){p.unshift(Array.prototype.indexOf.call(el.parentNode.children,el));el=el.parentNode;}return p;}
  function resolve(p){var n=document.body;for(var i=0;i<p.length;i++){n=n&&n.children[p[i]];if(!n)return null;}return n;}
  document.addEventListener('pointerdown',function(e){
    if(e.button!==0){down=null;return;}
    down={el:e.target,path:pathOf(e.target),clicked:false};
  },true);
  document.addEventListener('click',function(e){ if(down&&e.target===down.el)down.clicked=true; },true);
  document.addEventListener('pointerup',function(){
    var d=down; if(!d)return; down=null;
    setTimeout(function(){
      if(d.clicked||d.el.isConnected)return;
      var n=resolve(d.path); if(!n||n.disabled)return;
      var tag=(n.tagName||'').toLowerCase();
      if(tag==='input'||tag==='textarea'||tag==='select'){n.focus();if(tag==='input'&&(n.type==='checkbox'||n.type==='radio'))n.click();}
      else n.click();
    },0);
  },true);
})();
</script>
