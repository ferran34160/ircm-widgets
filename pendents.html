<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pense-bête</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #fff; color: #1a1a1a; padding: 16px; font-size: 13px; }
@media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #e8e8e8; } }

.wrap { max-width: 860px; margin: 0 auto; }
.title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.title-dot { width: 9px; height: 9px; border-radius: 50%; background: #BA9517; }

.add-row { display: flex; gap: 8px; margin-bottom: 14px; }
.add-row input[type=text] { flex: 1; min-width: 0; font-size: 14px; padding: 10px 12px; border: 1px solid #d5d5d5; border-radius: 9px; background: #fff; color: inherit; }
.add-row input[type=date] { font-size: 13px; padding: 9px 8px; border: 1px solid #d5d5d5; border-radius: 9px; background: #fff; color: inherit; }
@media (prefers-color-scheme: dark) { .add-row input[type=date] { background: #2a2a2a; border-color: #444; } }
.add-row input:focus { outline: none; border-color: #BA9517; box-shadow: 0 0 0 3px rgba(186,149,23,.15); }
@media (prefers-color-scheme: dark) { .add-row input { background: #2a2a2a; border-color: #444; } }
.btn { font-size: 12.5px; padding: 8px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn-primary { background: #BA9517; color: #fff; }
.btn-primary:hover { background: #a38214; }
.btn-ghost { background: rgba(0,0,0,.06); color: inherit; }
.btn-ghost:hover { background: rgba(0,0,0,.1); }
@media (prefers-color-scheme: dark) { .btn-ghost { background: rgba(255,255,255,.1); } .btn-ghost:hover { background: rgba(255,255,255,.16); } }

.toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { font-size: 12.5px; padding: 6px 12px; border: 1px solid #d5d5d5; border-radius: 16px; background: none; color: inherit; cursor: pointer; }
.tab:hover { background: rgba(128,128,128,.12); }
.tab.on { background: #378ADD; border-color: #378ADD; color: #fff; }
.tab .n { opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
@media (prefers-color-scheme: dark) { .tab { border-color: #444; } }
.search { margin-left: auto; font-size: 12.5px; padding: 6px 10px; border: 1px solid #d5d5d5; border-radius: 8px; background: #fff; color: inherit; width: 170px; }
@media (prefers-color-scheme: dark) { .search { background: #2a2a2a; border-color: #444; } }

.list { display: flex; flex-direction: column; gap: 9px; }
.task { border: 1px solid #e5e5e5; border-left-width: 4px; border-radius: 11px; padding: 11px 14px; background: #fafaf8; }
@media (prefers-color-scheme: dark) { .task { background: #202020; border-color: #353535; } }
.task.s-afaire { border-left-color: #378ADD; }
.task.s-attente { border-left-color: #D97B3F; }
.task.s-fait { border-left-color: #1D9E75; opacity: .72; }
.task.retard { border-left-color: #E24B4A; background: #FCEEEE; border-color: #F3CACA; }
@media (prefers-color-scheme: dark) { .task.retard { background: #3A1D1D; border-color: #5E2A2A; } }

.t-top { display: flex; align-items: flex-start; gap: 10px; }
.t-check { width: 20px; height: 20px; margin-top: 1px; flex-shrink: 0; cursor: pointer; accent-color: #1D9E75; }
.t-main { flex: 1; min-width: 0; }
.t-titre { font-size: 14px; font-weight: 500; word-break: break-word; }
.s-fait .t-titre { text-decoration: line-through; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; align-items: center; }
.chip { font-size: 11px; padding: 2px 9px; border-radius: 10px; background: rgba(0,0,0,.07); white-space: nowrap; }
@media (prefers-color-scheme: dark) { .chip { background: rgba(255,255,255,.1); } }
.chip.attente { background: #FBE2CC; color: #9A5410; font-weight: 500; }
.chip.lien { background: #E6F1FB; color: #0C447C; }
.chip.relance { background: #FAF0CC; color: #8A7510; font-weight: 500; }
.chip.relance.retard { background: #E24B4A; color: #fff; }
@media (prefers-color-scheme: dark) {
  .chip.attente { background: #4A3318; color: #E8B27C; }
  .chip.lien { background: #223a52; color: #9FC6EE; }
  .chip.relance { background: #4A4413; color: #E8D77C; }
}
.t-note { font-size: 12px; font-style: italic; color: #777; margin-top: 5px; white-space: pre-wrap; word-break: break-word; }
@media (prefers-color-scheme: dark) { .t-note { color: #aaa; } }

.t-actions { display: flex; gap: 4px; flex-shrink: 0; }
.ib { font-size: 12px; padding: 4px 8px; border: 1px solid transparent; border-radius: 7px; background: none; color: inherit; cursor: pointer; opacity: .75; white-space: nowrap; }
.ib:hover { background: rgba(128,128,128,.18); opacity: 1; }
.ib.wait { color: #D97B3F; border-color: #D97B3F55; opacity: 1; }
.ib.del:hover { color: #E24B4A; }

.edit { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (prefers-color-scheme: dark) { .edit { border-top-color: #444; } }
.edit .f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.edit .f.full { grid-column: 1 / -1; }
.edit label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #999; font-weight: 600; }
.edit input, .edit textarea { font-size: 13px; padding: 7px 9px; border: 1px solid #d5d5d5; border-radius: 7px; background: #fff; color: inherit; font-family: inherit; width: 100%; }
.edit textarea { resize: vertical; min-height: 54px; }
@media (prefers-color-scheme: dark) { .edit input, .edit textarea { background: #2a2a2a; border-color: #444; } }
.quick { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
.quick button { font-size: 11px; padding: 2px 8px; border: 1px solid #ccc; border-radius: 10px; background: none; color: inherit; cursor: pointer; }
.quick button:hover { background: rgba(128,128,128,.15); }
.edit-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }

.tl { margin-top: 8px; border-left: 2px solid rgba(128,128,128,.3); padding-left: 10px; display: flex; flex-direction: column; gap: 3px; }
.tl-item { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.tl-date { color: #888; font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 40px; }
.tl-txt { flex: 1; min-width: 0; word-break: break-word; white-space: pre-wrap; }
.tl-edit { visibility: hidden; border: none; background: none; color: #aaa; cursor: pointer; font-size: 12px; line-height: 1; padding: 0 4px; border-radius: 5px; }
.tl-item:hover .tl-edit { visibility: visible; }
.tl-edit:hover { color: #378ADD; background: rgba(55,138,221,.12); }
.tl-editbox { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 3px 0; padding: 8px; border: 1px dashed #378ADD; border-radius: 8px; width: 100%; }
.tl-editbox input[type=date] { font-size: 12px; padding: 5px 7px; border: 1px solid #d5d5d5; border-radius: 7px; background: #fff; color: inherit; }
.tl-editbox input[type=text] { flex: 1; min-width: 160px; font-size: 13px; padding: 6px 9px; border: 1px solid #d5d5d5; border-radius: 7px; background: #fff; color: inherit; }
@media (prefers-color-scheme: dark) { .tl-editbox input { background: #2a2a2a !important; border-color: #444 !important; } }
.seg button.on.neutre { background: #888; color: #fff; opacity: 1; }
.tl-del { visibility: hidden; border: none; background: none; color: #aaa; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; border-radius: 5px; }
.tl-item:hover .tl-del { visibility: visible; }
.tl-del:hover { color: #E24B4A; background: rgba(226,75,74,.1); }
.entry-add { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.entry-add input[type=date] { font-size: 12px; padding: 5px 7px; border: 1px solid #d5d5d5; border-radius: 7px; background: #fff; color: inherit; }
.entry-add input[type=text] { flex: 1; min-width: 160px; font-size: 13px; padding: 6px 9px; border: 1px solid #d5d5d5; border-radius: 7px; background: #fff; color: inherit; }
@media (prefers-color-scheme: dark) { .entry-add input { background: #2a2a2a !important; border-color: #444 !important; } }
.task.important { border-left-color: #E0A100; box-shadow: 0 0 0 1px rgba(224,161,0,.35); }
.task.important:not(.retard) { background: #FFF9E6; }
@media (prefers-color-scheme: dark) { .task.important:not(.retard) { background: #2E2A17; } }
.ib.star { font-size: 16px; opacity: .55; padding: 2px 6px; }
.ib.star.on { color: #E0A100; opacity: 1; }
.ib.close { color: #1D9E75; border-color: #1D9E7566; opacity: 1; }
.ib.close:hover { background: #1D9E75; color: #fff; }
.tab.imp.on { background: #E0A100; border-color: #E0A100; }
.seg { display: inline-flex; border: 1px solid #d5d5d5; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
@media (prefers-color-scheme: dark) { .seg { border-color: #444; } }
.seg button { font-size: 12px; padding: 5px 9px; border: none; background: none; color: inherit; cursor: pointer; opacity: .6; white-space: nowrap; }
.seg button:hover { opacity: 1; }
.seg button.on.moi { background: #378ADD; color: #fff; opacity: 1; }
.seg button.on.recu { background: #D97B3F; color: #fff; opacity: 1; }
.tl-dir { flex-shrink: 0; width: 16px; text-align: center; font-weight: 700; }
.tl-dir.moi { color: #378ADD; }
.tl-dir.recu { color: #D97B3F; }
.tl-dir.cloture { color: #1D9E75; }
.tl-chk { flex-shrink: 0; width: 16px; text-align: center; border: none; background: none; padding: 0; cursor: pointer; font-size: 15px; line-height: 1; color: #7B5EA7; }
.tl-chk:hover { transform: scale(1.2); }
.tl-item.todo .tl-txt { font-weight: 600; color: #7B5EA7; }
.tl-item.todo-fait .tl-txt { text-decoration: line-through; opacity: .6; }
.tl-item.todo.due .tl-txt::after { content: ' ⏰'; }
.seg button.on.todo { background: #7B5EA7; color: #fff; opacity: 1; }
.chip.todo { background: #EADFF5; color: #4F3380; font-weight: 500; }
.chip.todo.retard { background: #7B5EA7; color: #fff; }
@media (prefers-color-scheme: dark) { .chip.todo { background: #3A2B57; color: #CDB8EE; } .tl-chk, .tl-item.todo .tl-txt { color: #B79BE0; } }
.tl-item.cloture .tl-txt { color: #1D9E75; font-weight: 500; }
.close-box { margin-top: 10px; padding: 10px; border: 1px dashed #1D9E75; border-radius: 9px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.close-box input[type=date] { font-size: 12px; padding: 5px 7px; border: 1px solid #d5d5d5; border-radius: 7px; background: #fff; color: inherit; }
.close-box input[type=text] { flex: 1; min-width: 160px; font-size: 13px; padding: 6px 9px; border: 1px solid #d5d5d5; border-radius: 7px; background: #fff; color: inherit; }
@media (prefers-color-scheme: dark) { .close-box input { background: #2a2a2a !important; border-color: #444 !important; } }
.btn-ok { background: #1D9E75; color: #fff; }
.ib.log { color: #378ADD; border-color: #378ADD55; opacity: 1; }
.empty, .loading { text-align: center; padding: 36px; color: #aaa; }
.err { text-align: center; padding: 20px; color: #A32D2D; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title"><span class="title-dot"></span>Pense-bête</div>
  <div class="add-row">
    <input type="text" id="new-titre" placeholder="Nouvelle tâche… (Entrée pour ajouter)" autocomplete="off" onkeydown="if(event.key==='Enter')addTask()">
    <button class="btn btn-primary" onclick="addTask()">Ajouter</button>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div id="list"><div class="loading">Chargement…</div></div>
</div>

<script>
const TABLE = 'Pendents';
const ST_AFAIRE = 'À faire', ST_ATTENTE = 'En attente', ST_FAIT = 'Fait';
const TABLE_H = 'Pendents_historial';
let entryWasDone = false, tasks = [], hist = {}, tab = 'actives', q = '', editId = null, closeId = null, entryEditId = null, entrySens = '', onlyImp = false, lastSens = 'moi', drafts = {}, pendingRender = false;

function toMs(g){ if(!g)return 0; if(g>1e15)return g/1000; if(g>1e11)return g; return g*1000; }
function fmtDate(g){ const ms=toMs(g); if(!ms)return ''; const d=new Date(ms); if(isNaN(d)||d.getFullYear()>3000)return ''; return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',timeZone:'UTC'}); }
function dateInput(g){ const ms=toMs(g); if(!ms)return ''; const d=new Date(ms); if(isNaN(d))return ''; return d.toISOString().slice(0,10); }
function dateToGrist(s){ return s ? Math.floor(new Date(s+'T00:00:00Z').getTime()/1000) : null; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayG(){ return dateToGrist(todayStr()); }
function plusDaysStr(n){ const d=new Date(todayStr()+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

// ---------- Données ----------
async function ensureTable() {
  try { await grist.docApi.fetchTable(TABLE_H); }
  catch (e) { await grist.docApi.applyUserActions([['AddTable', TABLE_H, [
    {id:'Tasca', type:'Int'}, {id:'Data', type:'Date'}, {id:'Text', type:'Text'}, {id:'Sens', type:'Text'},
  ]]]); }
  try { await grist.docApi.fetchTable(TABLE); return; } catch (e) {}
  await grist.docApi.applyUserActions([['AddTable', TABLE, [
    {id:'Titre', type:'Text'},
    {id:'Statut', type:'Text'},
    {id:'Attente_de', type:'Text'},
    {id:'Relance', type:'Date'},
    {id:'Important', type:'Bool'},
    {id:'Lie_a', type:'Text'},
    {id:'Note', type:'Text'},
    {id:'Cree_le', type:'Date'},
    {id:'Fait_le', type:'Date'},
  ]]]);
}

async function fetchAll() {
  try {
    let t = await grist.docApi.fetchTable(TABLE);
    if (!t.Important) {           // table créée avant l'ajout de « Important » : on ajoute la colonne
      try { await grist.docApi.applyUserActions([['AddColumn', TABLE, 'Important', { type: 'Bool' }]]); t = await grist.docApi.fetchTable(TABLE); } catch (e) {}
    }
    tasks = (t.id||[]).map((id,i)=>({
      id,
      titre:(t.Titre||[])[i]||'',
      statut:(t.Statut||[])[i]||ST_AFAIRE,
      attente:(t.Attente_de||[])[i]||'',
      relance:(t.Relance||[])[i]||null,
      important:!!(t.Important||[])[i],
      lien:(t.Lie_a||[])[i]||'',
      note:(t.Note||[])[i]||'',
      cree:(t.Cree_le||[])[i]||null,
      fait:(t.Fait_le||[])[i]||null,
    }));
    hist = {};
    try {
      let h = await grist.docApi.fetchTable(TABLE_H);
      if (!h.Sens) {              // historique créé avant l'ajout du sens (moi / reçu)
        try { await grist.docApi.applyUserActions([['AddColumn', TABLE_H, 'Sens', { type: 'Text' }]]); h = await grist.docApi.fetchTable(TABLE_H); } catch (e) {}
      }
      (h.id||[]).forEach((id,i) => {
        const tid = (h.Tasca||[])[i];
        (hist[tid] = hist[tid] || []).push({ id, data:(h.Data||[])[i]||null, text:(h.Text||[])[i]||'', sens:(h.Sens||[])[i]||'' });
      });
      Object.values(hist).forEach(a => a.sort((x,y) => toMs(x.data) - toMs(y.data) || x.id - y.id));
    } catch (e) { hist = {}; }
    if (editId != null || closeId != null || entryEditId != null) { pendingRender = true; return; }   // ne pas détruire un formulaire en cours
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="err">Erreur : ' + esc(e.message) + '</div>';
  }
}

async function act(actions) {
  try { await grist.docApi.applyUserActions(actions); await fetchAll(); }
  catch (e) { alert('Erreur : ' + e.message); }
}

// ---------- Actions ----------
async function addTask() {
  const inp = document.getElementById('new-titre');
  const titre = inp.value.trim();
  if (!titre) return;
  inp.value = '';
  await act([['AddRecord', TABLE, null, { Titre: titre, Statut: ST_AFAIRE, Cree_le: todayG() }]]);
  inp.focus();
}
function toggleImportant(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  act([['UpdateRecord', TABLE, id, { Important: !t.important }]]);
}
function rouvrir(id) { act([['UpdateRecord', TABLE, id, { Statut: ST_AFAIRE, Fait_le: null }]]); }
function openClose(id) {
  editId = null; entryEditId = null; closeId = id; render();
  const el = document.getElementById('cl-text'); if (el) el.focus();
}
function cancelClose() { closeId = null; pendingRender = false; render(); }
async function confirmClose() {
  const id = closeId; if (id == null) return;
  const data = dateToGrist(document.getElementById('cl-date').value) || todayG();
  const concl = document.getElementById('cl-text').value.trim();
  closeId = null; pendingRender = false;
  await act([
    ['UpdateRecord', TABLE, id, { Statut: ST_FAIT, Fait_le: data }],
    ['AddRecord', TABLE_H, null, { Tasca: id, Data: data, Text: 'Clôturé' + (concl ? ' — ' + concl : ''), Sens: 'cloture' }],
  ]);
}
function delTask(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  if (!confirm('Supprimer « ' + t.titre + ' » ?')) return;
  act([...(hist[id]||[]).map(e => ['RemoveRecord', TABLE_H, e.id]), ['RemoveRecord', TABLE, id]]);
}
function setSens(id, v) {
  if (v !== 'todo') lastSens = v;
  setDraft(id, 'sens', v);
  document.querySelectorAll('#seg-' + id + ' button').forEach(b => b.classList.toggle('on', b.dataset.s === v));
  const el = document.getElementById('en-text-' + id); if (el) el.focus();
}
function setDraft(id, k, v) { (drafts[id] = drafts[id] || {})[k] = v; }
async function saveEntry(id) {
  const tEl = document.getElementById('en-text-' + id), dEl = document.getElementById('en-date-' + id);
  if (!tEl) return;
  const text = tEl.value.trim();
  if (!text) { tEl.focus(); return; }
  const data = dateToGrist(dEl && dEl.value) || todayG();
  try {
    await grist.docApi.applyUserActions([['AddRecord', TABLE_H, null, { Tasca: id, Data: data, Text: text, Sens: ((drafts[id] || {}).sens || lastSens) }]]);
    delete drafts[id];
    focusKeep = 'en-text-' + id;
    await fetchAll();
  } catch (e) { alert('Erreur : ' + e.message); }
}
function openEntryEdit(eid) {
  const e = Object.values(hist).flat().find(x => x.id === eid); if (!e) return;
  editId = null; closeId = null; entryEditId = eid; entrySens = (e.sens === 'todo_fait') ? 'todo' : (e.sens || ''); entryWasDone = e.sens === 'todo_fait';
  render();
  const el = document.getElementById('ee-text'); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (x) {} }
}
function cancelEntryEdit() { entryEditId = null; pendingRender = false; render(); }
function setEntrySens(v) {
  entrySens = v;
  document.querySelectorAll('#ee-seg button').forEach(b => b.classList.toggle('on', b.dataset.s === v));
}
async function saveEntryEdit() {
  const eid = entryEditId; if (eid == null) return;
  const text = document.getElementById('ee-text').value.trim();
  if (!text) { document.getElementById('ee-text').focus(); return; }
  const data = dateToGrist(document.getElementById('ee-date').value) || todayG();
  entryEditId = null; pendingRender = false;
  const sensFinal = (entrySens === 'todo' && entryWasDone) ? 'todo_fait' : entrySens;
  await act([['UpdateRecord', TABLE_H, eid, { Data: data, Text: text, Sens: sensFinal }]]);
}
function toggleTodo(eid) {
  const e = Object.values(hist).flat().find(x => x.id === eid); if (!e) return;
  act([['UpdateRecord', TABLE_H, eid, { Sens: e.sens === 'todo' ? 'todo_fait' : 'todo' }]]);
}
function delEntry(eid) { act([['RemoveRecord', TABLE_H, eid]]); }
function openEdit(id) {
  closeId = null; entryEditId = null; editId = id;
  render();
  const el = document.getElementById('e-titre');
  if (el) el.focus();
}
function closeEdit() {
  editId = null; pendingRender = false;
  render();
}
function setQuick(n) { const el = document.getElementById('e-relance'); if (el) el.value = plusDaysStr(n); }
function clearRelance() { const el = document.getElementById('e-relance'); if (el) el.value = ''; }
async function saveEdit() {
  const id = editId; if (id == null) return;
  const t = tasks.find(x => x.id === id); if (!t) { closeEdit(); return; }
  const titre = document.getElementById('e-titre').value.trim();
  if (!titre) { alert('Le titre est obligatoire.'); return; }
  const relance = dateToGrist(document.getElementById('e-relance').value);
  const lien = document.getElementById('e-lien').value.trim();
  editId = null; pendingRender = false;
  await act([['UpdateRecord', TABLE, id, { Titre: titre, Relance: relance, Lie_a: lien }]]);
}

// ---------- Rendu ----------
function setTab(t) { tab = t; editId = null; closeId = null; entryEditId = null; pendingRender = false; render(); }
function toggleOnlyImp() { onlyImp = !onlyImp; editId = null; closeId = null; entryEditId = null; pendingRender = false; render(); }
function onSearch(v) { q = v; if (editId == null && closeId == null && entryEditId == null) renderList(); }

function relanceInfo(t) {
  if (!t.relance || t.statut === ST_FAIT) return null;
  const diff = Math.round((toMs(t.relance) - toMs(todayG())) / 86400000);
  let txt;
  if (diff < 0) txt = 'relance en retard de ' + (-diff) + ' j';
  else if (diff === 0) txt = "relance aujourd'hui";
  else if (diff === 1) txt = 'relance demain';
  else txt = 'relance le ' + fmtDate(t.relance);
  return { diff, txt, retard: diff <= 0 };
}

function todosOuverts(t) { return (hist[t.id] || []).filter(e => e.sens === 'todo'); }
function todosDus(t) { const today = toMs(todayG()); return todosOuverts(t).filter(e => toMs(e.data) <= today); }
function enRetard(t) { const r = relanceInfo(t); return !!(r && r.retard) || (t.statut !== ST_FAIT && todosDus(t).length > 0); }
function dernierActivite(t) { const l = hist[t.id] || []; return l.length ? Math.max(toMs(t.cree), ...l.filter(e => e.sens !== 'todo').map(e => toMs(e.data))) : toMs(t.cree); }

function visibleTasks() {
  let list = tasks.slice();
  if (tab === 'actives') list = list.filter(t => t.statut !== ST_FAIT);
  else if (tab === 'fait') list = list.filter(t => t.statut === ST_FAIT);
  if (onlyImp) list = list.filter(t => t.important);
  const nq = norm(q.trim());
  if (nq) list = list.filter(t => norm([t.titre, t.lien, ...(hist[t.id]||[]).map(e => e.text)].join(' ')).includes(nq));
  if (tab === 'fait') return list.sort((a,b) => toMs(b.fait) - toMs(a.fait) || b.id - a.id);
  // Importantes d'abord, puis relances échues, puis activité la plus récente
  return list.sort((a,b) => {
    if (a.important !== b.important) return a.important ? -1 : 1;
    const ra = enRetard(a), rb = enRetard(b);
    if (ra !== rb) return ra ? -1 : 1;
    return dernierActivite(b) - dernierActivite(a) || b.id - a.id;
  });
}

function renderToolbar() {
  const nAct = tasks.filter(t => t.statut !== ST_FAIT).length;
  const nFait = tasks.filter(t => t.statut === ST_FAIT).length;
  const nRetard = tasks.filter(enRetard).length;
  const nImp = tasks.filter(t => t.important && t.statut !== ST_FAIT).length;
  const tabs = [['actives','À suivre',nAct],['fait','Clôturées',nFait],['tout','Tout',tasks.length]];
  document.getElementById('toolbar').innerHTML =
    tabs.map(([k,l,n]) => `<button class="tab ${tab===k?'on':''}" onclick="setTab('${k}')">${l}<span class="n">${n}</span></button>`).join('') +
    `<button class="tab imp ${onlyImp?'on':''}" title="Afficher seulement les tâches importantes" onclick="toggleOnlyImp()">★ Importantes<span class="n">${nImp}</span></button>` +
    (nRetard ? `<span class="chip relance retard" title="Tâches avec une relance ou une action à faire arrivée à échéance">⏰ ${nRetard} à traiter</span>` : '') +
    `<input class="search" id="search" type="text" placeholder="🔍 Rechercher…" value="${esc(q)}" oninput="onSearch(this.value)">`;
}

function taskHtml(t) {
  const fait = t.statut === ST_FAIT;
  const r = relanceInfo(t);
  const cls = fait ? 's-fait' : (enRetard(t) ? 'retard ' : '') + (t.important ? 'important ' : '') + 's-afaire';
  if (editId === t.id) return editHtml(t, cls);
  return `<div class="task ${cls}">
    <div class="t-top">
      <div class="t-main">
        <div class="t-titre">${esc(t.titre)}</div>
        <div class="t-meta">
          ${r ? `<span class="chip relance ${r.retard?'retard':''}">${esc(r.txt)}</span>` : ''}
          ${fait ? '' : todoChips(t)}
          ${t.lien ? `<span class="chip lien">🔗 ${esc(t.lien)}</span>` : ''}
          ${fait && t.fait ? `<span class="chip">clôturée le ${fmtDate(t.fait)}</span>` : ''}
        </div>
        ${timelineHtml(t)}
        ${fait ? '' : (closeId === t.id ? closeBoxHtml(t) : entryRowHtml(t))}
      </div>
      <div class="t-actions">
        <button class="ib star ${t.important?'on':''}" title="${t.important?'Retirer l\'importance':'Marquer comme important'}" onclick="toggleImportant(${t.id})">${t.important?'★':'☆'}</button>
        ${fait ? `<button class="ib" title="Rouvrir cette tâche" onclick="rouvrir(${t.id})">↺ Rouvrir</button>` : `<button class="ib close" title="Clôturer cette tâche" onclick="openClose(${t.id})">✓ Clôturer</button>`}
        <button class="ib" title="Modifier" onclick="openEdit(${t.id})">✎</button>
        <button class="ib del" title="Supprimer" onclick="delTask(${t.id})">🗑</button>
      </div>
    </div>
  </div>`;
}

function todoChips(t) {
  const o = todosOuverts(t); if (!o.length) return '';
  const due = todosDus(t).length;
  return `<span class="chip todo ${due?'retard':''}" title="Actions à faire dans l'historique">☐ ${o.length} à faire${due && due !== o.length ? ' (' + due + ' échue' + (due>1?'s':'') + ')' : ''}</span>`;
}
function entryRowHtml(t) {
  const d = drafts[t.id] || {};
  const sens = d.sens || lastSens;
  return `<div class="entry-add">
    <div class="seg" id="seg-${t.id}">
      <button type="button" class="moi ${sens==='moi'?'on':''}" data-s="moi" title="Une action que j'ai faite (mail envoyé, appel…)" onclick="setSens(${t.id},'moi')">➡ J'ai fait</button>
      <button type="button" class="recu ${sens==='recu'?'on':''}" data-s="recu" title="Quelque chose que j'ai reçu (réponse, devis…)" onclick="setSens(${t.id},'recu')">⬅ J'ai reçu</button>
      <button type="button" class="todo ${sens==='todo'?'on':''}" data-s="todo" title="Une chose à faire plus tard (ex. : transférer le BC quand je le recevrai). La date = pour quand." onclick="setSens(${t.id},'todo')">☐ À faire</button>
    </div>
    <input type="date" id="en-date-${t.id}" value="${esc(d.date || todayStr())}" title="Date de l'événement" oninput="setDraft(${t.id},'date',this.value)">
    <input type="text" id="en-text-${t.id}" value="${esc(d.text || '')}" placeholder="Actualisation : ce qui s'est passé… (ou ce qu'il faudra faire)" autocomplete="off" oninput="setDraft(${t.id},'text',this.value)" onkeydown="if(event.key==='Enter')saveEntry(${t.id})">
    <button class="btn btn-primary" onclick="saveEntry(${t.id})">Ajouter</button>
  </div>`;
}
function closeBoxHtml(t) {
  return `<div class="close-box">
    <span style="font-weight:600;color:#1D9E75">✓ Clôturer</span>
    <input type="date" id="cl-date" value="${todayStr()}" title="Date de clôture">
    <input type="text" id="cl-text" placeholder="Conclusion (optionnel) : ce qui a été décidé / obtenu…" autocomplete="off" onkeydown="if(event.key==='Enter')confirmClose();if(event.key==='Escape')cancelClose()">
    <button class="btn btn-ok" onclick="confirmClose()">Clôturer</button>
    <button class="btn btn-ghost" onclick="cancelClose()">Annuler</button>
  </div>`;
}
function fmtEntryDate(g) {
  const ms = toMs(g); if (!ms) return '';
  const d = new Date(ms);
  const same = d.getUTCFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('fr-FR', same ? { day:'2-digit', month:'2-digit', timeZone:'UTC' } : { day:'2-digit', month:'2-digit', year:'2-digit', timeZone:'UTC' });
}
function dirHtml(s, id) {
  if (s === 'todo') return `<button class="tl-chk" title="À faire — cliquer pour cocher" onclick="toggleTodo(${id})">☐</button>`;
  if (s === 'todo_fait') return `<button class="tl-chk" title="Fait — cliquer pour décocher" onclick="toggleTodo(${id})">☑</button>`;
  if (s === 'moi') return '<span class="tl-dir moi" title="Action de ma part">➡</span>';
  if (s === 'recu') return '<span class="tl-dir recu" title="Reçu">⬅</span>';
  if (s === 'cloture') return '<span class="tl-dir cloture" title="Clôture">✓</span>';
  return '<span class="tl-dir"></span>';
}
function timelineHtml(t) {
  const list = hist[t.id] || [];
  if (!list.length) return '';
  return '<div class="tl">' + list.map(e => {
    if (e.id === entryEditId) {
      const clot = e.sens === 'cloture';
      return `<div class="tl-editbox">
        <input type="date" id="ee-date" value="${dateInput(e.data) || todayStr()}">
        ${clot ? '' : `<div class="seg" id="ee-seg">
          <button type="button" class="moi ${entrySens==='moi'?'on':''}" data-s="moi" onclick="setEntrySens('moi')">➡ J'ai fait</button>
          <button type="button" class="recu ${entrySens==='recu'?'on':''}" data-s="recu" onclick="setEntrySens('recu')">⬅ J'ai reçu</button>
          <button type="button" class="todo ${entrySens==='todo'?'on':''}" data-s="todo" onclick="setEntrySens('todo')">☐ À faire</button>
          <button type="button" class="neutre ${entrySens===''?'on':''}" data-s="" title="Sans indication" onclick="setEntrySens('')">—</button>
        </div>`}
        <input type="text" id="ee-text" value="${esc(e.text)}" autocomplete="off" onkeydown="if(event.key==='Enter')saveEntryEdit();if(event.key==='Escape')cancelEntryEdit()">
        <button class="btn btn-primary" onclick="saveEntryEdit()">OK</button>
        <button class="btn btn-ghost" onclick="cancelEntryEdit()">Annuler</button>
      </div>`;
    }
    return `<div class="tl-item ${e.sens==='cloture'?'cloture':''} ${e.sens==='todo'?'todo'+(toMs(e.data)<=toMs(todayG())?' due':''):''} ${e.sens==='todo_fait'?'todo-fait':''}"><span class="tl-date">${fmtEntryDate(e.data)}</span>${dirHtml(e.sens, e.id)}<span class="tl-txt">${esc(e.text)}</span><button class="tl-edit" title="Modifier cette actualisation" onclick="openEntryEdit(${e.id})">✎</button><button class="tl-del" title="Supprimer cette entrée" onclick="delEntry(${e.id})">×</button></div>`;
  }).join('') + '</div>';
}

function editHtml(t, cls) {
  return `<div class="task ${cls}">
    <div class="t-top"><div class="t-main"><div class="t-titre">Modifier la tâche</div></div></div>
    <div class="edit">
      <div class="f full"><label>Tâche</label><input type="text" id="e-titre" value="${esc(t.titre)}" onkeydown="if(event.key==='Enter')saveEdit();if(event.key==='Escape')closeEdit()"></div>
      <div class="f"><label>Me le rappeler le</label><input type="date" id="e-relance" value="${dateInput(t.relance)}">
        <div class="quick"><button type="button" onclick="setQuick(2)">+2 j</button><button type="button" onclick="setQuick(7)">+1 sem.</button><button type="button" onclick="setQuick(14)">+2 sem.</button><button type="button" onclick="clearRelance()">aucune</button></div>
      </div>
      <div class="f full"><label>Lié à (DA, BC, contrat… — libre)</label><input type="text" id="e-lien" value="${esc(t.lien)}" placeholder="Ex. DA-2026-045"></div>
      <div class="edit-actions">
        <button class="btn btn-primary" onclick="saveEdit()">Enregistrer</button>
        <button class="btn btn-ghost" onclick="closeEdit()">Annuler</button>
      </div>
    </div>
  </div>`;
}

function renderList() {
  const box = document.getElementById('list');
  const list = visibleTasks();
  if (!list.length) {
    box.innerHTML = '<div class="empty">' + (q.trim() ? 'Aucun résultat.' : tab === 'fait' ? 'Aucune tâche clôturée pour le moment.' : 'Rien à suivre 🎉') + '</div>';
    return;
  }
  box.innerHTML = '<div class="list">' + list.map(taskHtml).join('') + '</div>';
}

let focusKeep = null;
function render() {
  const ae = document.activeElement;
  let fid = focusKeep, pos = null;
  if (!fid && ae && ae.id && /^(en-text-|en-date-|ee-text|ee-date|search)/.test(ae.id)) { fid = ae.id; try { pos = ae.selectionStart; } catch (e) {} }
  focusKeep = null;
  renderToolbar();
  renderList();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { const n = pos == null ? el.value.length : pos; el.setSelectionRange(n, n); } catch (e) {} } }
}

// ---------- Démarrage ----------
const gristScript = document.createElement('script');
gristScript.src = 'https://docs.getgrist.com/grist-plugin-api.js';
gristScript.onload = async () => {
  grist.ready({ requiredAccess: 'full' });
  try { await ensureTable(); await fetchAll(); grist.onRecords(() => fetchAll()); }
  catch (e) { document.getElementById('list').innerHTML = '<div class="err">Erreur : ' + esc(e.message) + '</div>'; }
};
gristScript.onerror = () => { document.getElementById('list').innerHTML = '<div class="loading">Grist non disponible.</div>'; };
document.head.appendChild(gristScript);
</script>
<script>
/* FIX-PREMIER-CLIC v2: si le widget se re-dessine (focus / onRecords) entre l'appui et le relâchement
   de la souris, le clic se perdait. On le rejoue sur l'élément équivalent du nouveau DOM,
   uniquement si AUCUN clic n'a été reçu et que l'élément équivalent est identique (même balise, même texte). */
(function(){
  var d=null;
  function pathOf(el){var p=[];while(el&&el!==document.body&&el.parentNode){p.unshift(Array.prototype.indexOf.call(el.parentNode.children,el));el=el.parentNode;}return p;}
  function resolve(p){var n=document.body;for(var i=0;i<p.length;i++){n=n&&n.children[p[i]];if(!n)return null;}return n;}
  document.addEventListener('pointerdown',function(e){
    if(e.button!==0){d=null;return;}
    var t=e.target;
    d={el:t,path:pathOf(t),tag:t.tagName,text:t.textContent,type:t.type||'',clicked:false};
  },true);
  document.addEventListener('click',function(e){ if(d&&(e.target===d.el||(d.el.contains&&d.el.contains(e.target))))d.clicked=true; },true);
  document.addEventListener('pointerup',function(){
    var dd=d; if(!dd)return;
    setTimeout(function(){
      if(dd.clicked||dd.el.isConnected)return;
      var n=resolve(dd.path); if(!n||n.disabled||n.tagName!==dd.tag||(n.type||'')!==dd.type||n.textContent!==dd.text)return;
      var tag=n.tagName.toLowerCase();
      if(tag==='input'||tag==='textarea'||tag==='select'){n.focus();if(tag==='input'&&(n.type==='checkbox'||n.type==='radio'))n.click();}
      else n.click();
    },40);
  },true);
})();
</script>
