<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des DA</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #fff; color: #1a1a1a; padding: 14px; font-size: 13px; }
@media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #e8e8e8; } }
.toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.tab { font-size: 12px; padding: 6px 12px; border-radius: 7px; border: 1px solid #ccc; background: inherit; color: inherit; cursor: pointer; }
.tab.active { background: #378ADD; color: #fff; border-color: #378ADD; }
.bc-search { margin-left: 6px; }
.bc-search input { font-size: 12px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 7px; background: inherit; color: inherit; width: 200px; }
.bc-search input:focus { outline: none; border-color: #378ADD; }
@media (prefers-color-scheme: dark) { .bc-search input { border-color: #444; } }
.libres-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 18px 16px; border-radius: 12px; background: #9C6ADE; color: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(156,106,222,0.25); width: 130px; }
.libres-card:hover { background: #875BC8; }
.libres-card.active { box-shadow: 0 0 0 3px rgba(156,106,222,0.4); }
.libres-icon { width: 44px; height: 44px; border-radius: 11px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 24px; }
@media (prefers-color-scheme: dark) { .tab { border-color: #444; } }
.spacer { flex: 1; }
.btn-new { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: 8px; border: none; background: #1D9E75; color: #fff; cursor: pointer; box-shadow: 0 1px 3px rgba(29,158,117,0.3); }
.btn-new:hover { background: #178A65; }
.refresh { font-size: 13px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 6px; background: inherit; color: inherit; cursor: pointer; }
@media (prefers-color-scheme: dark) { .refresh { border-color: #444; } }
.layout { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.cards-row { display: flex; gap: 12px; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.inner-layout { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
@media (max-width: 720px) { .inner-layout { grid-template-columns: 1fr; } }
.panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #999; margin-bottom: 8px; }
.filters-row { display: flex; gap: 6px; margin-bottom: 8px; }
.four-filter { flex: 1; min-width: 0; font-size: 12px; padding: 6px 9px; border-radius: 7px; border: 1px solid #ccc; background: inherit; color: inherit; }
@media (prefers-color-scheme: dark) { .four-filter { border-color: #444; } }
.da-list { display: flex; flex-direction: column; gap: 6px; max-height: 600px; overflow-y: auto; }
.new-da-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 18px 16px; border-radius: 12px; background: #1D9E75; color: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(29,158,117,0.25); width: 130px; }
.new-da-card:hover { background: #178A65; }
.new-da-card.active { box-shadow: 0 0 0 3px rgba(29,158,117,0.4); }
.new-da-icon { width: 44px; height: 44px; border-radius: 11px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 300; }
.nouvel-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 18px 16px; border-radius: 12px; background: #D97B3F; color: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(217,123,63,0.25); width: 130px; }
.nouvel-card:hover { background: #C06A32; }
.nouvel-card.active { box-shadow: 0 0 0 3px rgba(217,123,63,0.4); }
.nouvel-icon { width: 44px; height: 44px; border-radius: 11px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.nv-type-row { display: flex; gap: 8px; margin: 2px 0 16px; }
.nv-type-btn { font-size: 13px; padding: 9px 16px; border-radius: 8px; border: 1px solid #ccc; background: none; color: inherit; cursor: pointer; font-weight: 500; }
.nv-type-btn:hover { background: rgba(128,128,128,.12); }
.nv-type-btn.sel { background: #D97B3F; border-color: #D97B3F; color: #fff; }
@media (prefers-color-scheme: dark) { .nv-type-btn { border-color: #444; } }
.nv-frais-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #888; margin: 14px 0 8px; }
.nv-frais-row { display: grid; grid-template-columns: 1fr 130px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
.nv-frais-row input { font-size: 13px; padding: 7px 9px; border-radius: 7px; border: 1px solid #ccc; background: inherit; color: inherit; width: 100%; box-sizing: border-box; }
@media (prefers-color-scheme: dark) { .nv-frais-row input { border-color: #444; } }
.nv-frais-del { background: none; border: none; color: #E24B4A; cursor: pointer; font-size: 18px; line-height: 1; padding: 0; }
.btn-add-frais { background: none; border: 1px dashed #378ADD; color: #378ADD; padding: 7px 13px; font-size: 12px; border-radius: 7px; cursor: pointer; margin-top: 2px; }
.btn-add-frais:hover { background: rgba(55,138,221,0.08); }
.seg-mvt { display: flex; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; width: fit-content; }
@media (prefers-color-scheme: dark) { .seg-mvt { border-color: #444; } }
.seg-mvt button { font-size: 13px; padding: 8px 14px; border: none; background: none; color: inherit; cursor: pointer; font-weight: 500; }
.seg-mvt button.sel-sortie { background: #E24B4A; color: #fff; }
.seg-mvt button.sel-entree { background: #1D9E75; color: #fff; }
.nv-dem-box { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; min-height: 38px; align-content: flex-start; }
@media (prefers-color-scheme: dark) { .nv-dem-box { border-color: #444; } }
.nv-dem-chip { font-size: 12px; padding: 4px 10px; border-radius: 13px; background: #EAF3FB; color: #0C447C; cursor: pointer; user-select: none; }
.nv-dem-chip:hover { filter: brightness(0.96); }
.nv-dem-chip.sel { background: #378ADD; color: #fff; }
@media (prefers-color-scheme: dark) { .nv-dem-chip { background: #223a52; color: #9FC6EE; } }
.nv-recap { margin-top: 10px; font-size: 12px; padding: 10px 13px; border-radius: 9px; background: #E1F5EE; border: 1px solid #B9E4D3; color: #085041; display: none; }
.nv-recap.show { display: block; }
.nv-recap-check { font-weight: 600; margin-right: 4px; }
.nv-recap-detail { color: #0F6E56; margin-top: 3px; font-size: 11px; }
@media (prefers-color-scheme: dark) { .nv-recap { background: #123528; border-color: #1D5F49; color: #7FD9B8; } .nv-recap-detail { color: #6FC9A8; } }
.new-da-title { font-size: 14px; font-weight: 600; }
.new-da-sub { font-size: 11px; opacity: 0.85; }
.da-item { border: 1px solid #e5e5e5; border-radius: 9px; padding: 9px 11px; cursor: pointer; }
@media (prefers-color-scheme: dark) { .da-item { border-color: #383838; } }
.da-item.sel { border-color: #378ADD; border-width: 1.5px; background: #E6F1FB; }
@media (prefers-color-scheme: dark) { .da-item.sel { background: #0C2D4D; } }
.da-item.libres { border-style: dashed; border-color: #BA7517; }
.da-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
.da-item-num { font-size: 13px; font-weight: 600; }
.badge { font-size: 10px; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.b-cours { background: #F1EFE8; color: #5F5E5A; }
.b-pgm { background: #E6F1FB; color: #0C447C; }
.b-bc { background: #E1F5EE; color: #085041; }
.b-libres { background: #FAEEDA; color: #854F0B; }
@media (prefers-color-scheme: dark) {
  .b-cours { background: #444441; color: #D3D1C7; }
  .b-pgm { background: #0C447C; color: #B5D4F4; }
  .b-bc { background: #085041; color: #9FE1CB; }
  .b-libres { background: #633806; color: #FAC775; }
}
.da-item-meta { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.da-item-foot { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; }
.da-item-total { font-weight: 500; }
.detail { border: 1px solid #e5e5e5; border-radius: 11px; overflow: hidden; max-width: 1100px; }
@media (prefers-color-scheme: dark) { .detail { border-color: #383838; } }
.detail-head { background: #eef2f6; padding: 11px 13px; }
@media (prefers-color-scheme: dark) { .detail-head { background: #283038; } }
.detail-head-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.detail-num { font-size: 15px; font-weight: 600; }
.detail-route { font-size: 12px; color: #666; }
@media (prefers-color-scheme: dark) { .detail-route { color: #aaa; } }
.detail-arts { padding: 8px 13px; }
.art { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
@media (prefers-color-scheme: dark) { .art { border-bottom-color: #2e2e2e; } }
.art:last-child { border-bottom: none; }
.art-name { word-break: break-word; }
.art-main { display: flex; justify-content: space-between; gap: 10px; }
.art-dem { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.dem-tag { font-size: 10px; padding: 1px 7px; border-radius: 5px; background: #EFEAF8; color: #5E3A9E; }
@media (prefers-color-scheme: dark) { .dem-tag { background: #2E2440; color: #C4A8E8; } }
.art-ref { color: #999; font-size: 11px; font-weight: 400; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .art-ref { color: #888; } }
.art.svc { font-style: italic; opacity: 0.6; font-size: 11px; }
.art-price { white-space: nowrap; font-variant-numeric: tabular-nums; }
.art-right { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.art-livr { font-size: 10px; padding: 1px 7px; border-radius: 5px; white-space: nowrap; }
.art-livr.recu { background: #E1F5EE; color: #1D9E75; }
.art-livr.attente { background: rgba(0,0,0,0.06); color: #999; }
@media (prefers-color-scheme: dark) { .art-livr.recu { background: #16291F; color: #5FCFA0; } .art-livr.attente { background: rgba(255,255,255,0.08); color: #888; } }
.art-devise { font-size: 10px; color: #B8860B; font-style: italic; margin-top: 2px; }
@media (prefers-color-scheme: dark) { .art-devise { color: #E0C060; } }
.detail-action { padding: 13px; border-top: 1px solid #eee; }
.detail-action-title { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #999; margin-bottom: 8px; }
.detail-action-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.detail-action-row input { font-size: 13px; padding: 7px 10px; border-radius: 6px; border: 1px solid #ccc; background: inherit; color: inherit; }
@media (prefers-color-scheme: dark) { .detail-action-row input { border-color: #444; } .detail-action { border-top-color: #333; } }
.btn-pgm { font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: 7px; border: none; background: #378ADD; color: #fff; cursor: pointer; }
.btn-pgm:hover { background: #2D72BD; }
.detail-files { padding: 11px 13px; border-top: 1px solid #eee; }
@media (prefers-color-scheme: dark) { .detail-files { border-top-color: #333; } }
.detail-files-title { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #999; margin-bottom: 8px; }
.detail-files-row { display: flex; gap: 8px; flex-wrap: wrap; }
.file-cat { display: flex; gap: 4px; align-items: center; }
.file-add { width: 18px; height: 18px; line-height: 16px; text-align: center; padding: 0; border-radius: 50%; border: 1px solid #378ADD; color: #378ADD; background: none; cursor: pointer; font-size: 13px; flex: none; }
.file-add:hover { background: #378ADD; color: #fff; }
.file-add:disabled { opacity: .4; cursor: default; }
@media (prefers-color-scheme: dark) { .file-add { border-color: #7ab3f0; color: #7ab3f0; } .file-add:hover { background: #378ADD; color: #16314A; } }
.file-link { font-size: 12px; padding: 4px 11px; border-radius: 6px; background: #E6F1FB; color: #0C447C; text-decoration: none; border: 1px solid #C5DFF5; cursor: pointer; }
.file-link:hover { background: #D5E8FA; }
.file-empty { font-size: 12px; padding: 4px 11px; border-radius: 6px; background: #f2f2f0; color: #bbb; border: 1px dashed #ddd; }
@media (prefers-color-scheme: dark) {
  .file-link { background: #0C2D4D; color: #9FC6F0; border-color: #1A4570; }
  .file-empty { background: #2a2a2a; color: #666; border-color: #444; }
}
.detail-foot { display: flex; justify-content: space-between; padding: 10px 13px; border-top: 1px solid #eee; background: #fafafa; }
.detail-dates { font-size: 11px; color: #999; margin-top: 3px; }
.total-devise { font-size: 11px; color: #B8860B; font-style: italic; text-align: right; padding: 4px 13px 8px; background: #fafafa; }
.da-item-livr { margin-top: 5px; }
.da-livr { font-size: 10px; padding: 1px 7px; border-radius: 5px; }
.da-livr.all { background: #E1F5EE; color: #1D9E75; }
.da-livr.partial { background: #FBF3E0; color: #BA7517; }
.da-livr.none { background: rgba(0,0,0,0.06); color: #999; }
@media (prefers-color-scheme: dark) { .da-livr.all { background: #16291F; color: #5FCFA0; } .da-livr.partial { background: #332B16; color: #E0C060; } .da-livr.none { background: rgba(255,255,255,0.08); color: #888; } }
@media (prefers-color-scheme: dark) { .total-devise { color: #E0C060; background: #242424; } }
@media (prefers-color-scheme: dark) { .detail-foot { background: #242424; border-top-color: #333; } }
.detail-total { font-weight: 600; font-size: 14px; }
.empty { text-align: center; padding: 40px 20px; color: #aaa; font-size: 13px; }
.loading { text-align: center; padding: 40px; color: #888; }
/* Assignació */
.assign-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.assign-toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
.assign-toolbar button { font-size: 11px; padding: 4px 9px; border: 1px solid #ccc; border-radius: 6px; background: inherit; color: inherit; cursor: pointer; }
@media (prefers-color-scheme: dark) { .assign-toolbar button { border-color: #444; } }
.assign-da-select { width: 100%; font-size: 13px; padding: 7px 10px; border-radius: 6px; border: 1px solid #ccc; background: inherit; color: inherit; margin-bottom: 10px; }
.assign-da-label { font-size: 12px; font-weight: 600; color: #666; margin: 14px 0 6px; }
@media (prefers-color-scheme: dark) { .assign-da-label { color: #aaa; } }
@media (prefers-color-scheme: dark) { .assign-da-select { border-color: #444; } }
.assign-art { display: block; padding: 8px 11px; border: 1px solid #e5e5e5; border-radius: 8px; margin-bottom: 5px; }
@media (prefers-color-scheme: dark) { .assign-art { border-color: #383838; } }
.assign-art.checked { background: #E6F1FB; border-color: #378ADD; }
@media (prefers-color-scheme: dark) { .assign-art.checked { background: #0C2D4D; } }
.assign-check { width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid #bbb; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; cursor: pointer; }
.assign-art.checked .assign-check { background: #378ADD; border-color: #378ADD; color: #fff; }
.assign-art-info { flex: 1; min-width: 0; }
.assign-art-name { font-size: 12px; font-weight: 500; }
.assign-art-meta { font-size: 11px; color: #888; }
.btn-split { flex-shrink: 0; font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid #9C6ADE; color: #9C6ADE; background: none; cursor: pointer; white-space: nowrap; }
.btn-split:hover { background: #9C6ADE; color: #fff; }
.split-panel { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd; }
@media (prefers-color-scheme: dark) { .split-panel { border-top-color: #444; } }
.split-row { display: flex; gap: 10px; }
.split-field { flex: 1; margin-bottom: 8px; }
.split-field label { font-size: 10.5px; color: #999; text-transform: uppercase; letter-spacing: .03em; display: block; margin-bottom: 4px; }
.split-field input { width: 100%; box-sizing: border-box; font-size: 13px; padding: 7px 10px; border-radius: 6px; border: 1px solid #ccc; background: inherit; color: inherit; }
@media (prefers-color-scheme: dark) { .split-field input { border-color: #444; } }
.split-total { font-size: 13px; font-weight: 600; padding: 7px 0; }
.btn-assign { width: 100%; margin-top: 10px; padding: 10px; background: #378ADD; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-assign:disabled { background: #ccc; cursor: not-allowed; }
@media (prefers-color-scheme: dark) { .btn-assign:disabled { background: #444; } }
.msg { text-align: center; padding: 9px; border-radius: 8px; margin-top: 10px; font-size: 12px; display: none; }
.msg.ok { background: #E1F5EE; color: #085041; display: block; }
.msg.err { background: #FCEBEB; color: #A32D2D; display: block; }
.btn-delete { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid #E24B4A; color: #E24B4A; background: none; cursor: pointer; }
.btn-delete:hover { background: #E24B4A; color: #fff; }
.btn-assign-link { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid #9C6ADE; color: #9C6ADE; background: none; cursor: pointer; }
.btn-assign-link:hover { background: #9C6ADE; color: #fff; }
.delete-confirm { padding: 11px 13px; border-top: 1px solid #eee; display: none; }
.delete-confirm.open { display: block; }
@media (prefers-color-scheme: dark) { .delete-confirm { border-top-color: #333; } }
.delete-confirm-title { font-size: 11px; color: #E24B4A; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
.delete-confirm-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.del-opt { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.del-opt > button { flex: none; min-width: 260px; text-align: left; }
.del-opt-desc { font-size: 12px; color: #777; flex: 1 1 240px; }
@media (prefers-color-scheme: dark) { .del-opt-desc { color: #aaa; } }
.btn-del-only { font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 7px; border: none; background: #E24B4A; color: #fff; cursor: pointer; }
.btn-del-only:hover { background: #c73e3d; }
.btn-del-all { font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 7px; border: 1px solid #E24B4A; color: #E24B4A; background: none; cursor: pointer; }
.btn-del-all:hover { background: #FCEBEB; }
.btn-del-cancel { font-size: 12px; padding: 7px 14px; border-radius: 7px; border: 1px solid #ccc; color: inherit; background: none; cursor: pointer; }
@media (prefers-color-scheme: dark) { .btn-del-cancel { border-color: #444; } }

/* ===== Édition / suppression : panneaux EN LIGNE ===== */
.btn-edit { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid #378ADD; color: #378ADD; background: none; cursor: pointer; }
.btn-edit:hover { background: #378ADD; color: #fff; }
.assign-total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 8px; padding: 10px 13px; border-radius: 8px; background: rgba(0,0,0,.045); font-size: 13px; }
@media (prefers-color-scheme: dark) { .assign-total { background: rgba(255,255,255,.07); } }
.assign-total-lbl { color: #777; }
@media (prefers-color-scheme: dark) { .assign-total-lbl { color: #aaa; } }
.assign-total-val { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.assign-total.vide .assign-total-val { color: #aaa; font-weight: 500; }
/* Fila d'article del detall de la DA : el nom pren tot l'ample que pot; el grup
   (preu + botons + demandeur) va a la dreta, i baixa a una 2a línia si no hi cap. */
.detail-arts .art { align-items: center; flex-wrap: wrap; row-gap: 4px; }
.detail-arts .art-namecol { flex: 1 1 560px; min-width: 0; }
.detail-arts .art-side { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; white-space: nowrap; }
.detail-arts .art-price { min-width: 84px; text-align: right; }
.detail-arts .art-dem-col { min-width: 56px; display: flex; justify-content: flex-end; }
.detail-arts .art-dem-col .art-dem { margin-top: 0; justify-content: flex-end; }
.art-btns { display: inline-flex; gap: 6px; flex: none; align-items: center; white-space: nowrap; }
.btn-art-edit, .btn-art-del { font-size: 11px; padding: 5px 10px; border-radius: 6px; background: none; cursor: pointer; font-family: inherit; white-space: nowrap; line-height: 1.3; }
.btn-art-edit { border: 1px solid #378ADD; color: #378ADD; }
.btn-art-edit:hover { background: #378ADD; color: #fff; }
.btn-art-del { border: 1px solid #E24B4A; color: #E24B4A; }
.btn-art-del:hover { background: #E24B4A; color: #fff; }
.ed-inline { margin: 8px 0 12px; padding: 12px 14px; border: 1px solid #cfe0f3; background: #f5f9fe; border-radius: 9px; font-size: 13px; font-style: normal; opacity: 1; }
@media (prefers-color-scheme: dark) { .ed-inline { background: #182430; border-color: #2b4258; } }
.ed-inline.danger { border-color: #f0c4c3; background: #fdf3f3; }
@media (prefers-color-scheme: dark) { .ed-inline.danger { background: #2e1a1a; border-color: #5a2f2f; } }
.ed-inline-title { font-size: 11px; color: #2563a8; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 10px; font-weight: 600; }
.ed-inline.danger .ed-inline-title { color: #E24B4A; }
.ed-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 12px; }
.ed-field.full { grid-column: 1 / -1; }
.ed-field label { font-size: 10.5px; color: #999; text-transform: uppercase; letter-spacing: .03em; display: block; margin-bottom: 4px; }
.ed-field input, .ed-field select { width: 100%; box-sizing: border-box; font-size: 13px; padding: 7px 10px; border-radius: 6px; border: 1px solid #ccc; background: #fff; color: inherit; font-family: inherit; }
@media (prefers-color-scheme: dark) { .ed-field input, .ed-field select { background: #2a2a2a; }}
@media (prefers-color-scheme: dark) { .ed-field input, .ed-field select { border-color: #444; } }
.ed-hint { font-size: 11px; color: #999; margin-top: 3px; }
.ed-inline-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.ed-save { background: #2563a8; color: #fff; border: none; border-radius: 7px; padding: 7px 16px; font-size: 12px; font-weight: 500; cursor: pointer; }
.ed-save:hover { background: #1d4e85; }
.ed-save:disabled, .btn-del-only:disabled { opacity: .5; cursor: default; }
.ed-warn { font-size: 12px; padding: 8px 10px; border-radius: 6px; background: #FDF1E3; color: #8A4A18; border: 1px solid #F0D3AE; margin: 8px 0; }
@media (prefers-color-scheme: dark) { .ed-warn { background: #3D2A1A; color: #E0A87C; border-color: #5a3f24; } }
.ed-msg { font-size: 12px; min-height: 16px; }
.ed-msg.err { color: #A32D2D; }
.ed-msg.ok { color: #0F6E56; }

/* ===== Améliorations : disponible, nouvelle DA depuis la sélection, répartitions ===== */
.btn-assign-alt { width: 100%; margin-top: 8px; padding: 9px; background: none; color: #1D9E75; border: 1.5px solid #1D9E75; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-assign-alt:hover:not(:disabled) { background: #1D9E75; color: #fff; }
.btn-assign-alt:disabled { opacity: .4; cursor: default; }
.dispo-info { margin: 8px 0 4px; padding: 10px 13px; border-radius: 8px; background: #EAF3FB; border: 1px solid #cfe0f3; font-size: 12.5px; }
@media (prefers-color-scheme: dark) { .dispo-info { background: #182430; border-color: #2b4258; } }
.dispo-info.neg { background: #FDF3F3; border-color: #f0c4c3; }
@media (prefers-color-scheme: dark) { .dispo-info.neg { background: #2e1a1a; border-color: #5a2f2f; } }
.dispo-title { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
.dispo-row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-variant-numeric: tabular-nums; }
.dispo-row.dispo-res { border-top: 1px solid rgba(128,128,128,.35); margin-top: 4px; padding-top: 6px; font-weight: 700; font-size: 13.5px; }
.dispo-info.neg .dispo-res { color: #C0392B; }
.dispo-hint { font-size: 11px; color: #999; margin-top: 6px; }
.dispo-alert { font-size: 12px; color: #C0392B; margin-top: 6px; }
.art-rep { font-size: 11px; color: #9C6ADE; margin-top: 3px; line-height: 1.6; }
.btn-rep-merge { font-size: 10.5px; padding: 1px 8px; margin-left: 6px; border-radius: 10px; border: 1px solid #9C6ADE; color: #9C6ADE; background: none; cursor: pointer; }
.btn-rep-merge:hover { background: #9C6ADE; color: #fff; }
.ed-parts { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
.ed-parts td { padding: 4px 6px; border-bottom: 1px solid rgba(128,128,128,.25); }
.ed-parts td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="container"><div class="loading">Chargement…</div></div>

<script>
let das = [], commandes = [], commandesByDA = new Map(), contratNoms = {}, fourNoms = {}, contratsMasques = new Set();
let contratsList = [], fournisseursList = [], lignesList = [];
let tab = 'toutes', selectedDA = null, selectedArts = new Set(), filterFour = '', filterDem = '', searchBC = '';
let splitArticleId = null;  // id de l'article libre en cours de répartition partielle
let preselectDA = null;  // id de DA à présélectionner en arrivant sur Articles libres
let nouvelType = null;   // 'Produit' | 'Service' | 'Mouvement' | null (aucun choisi)
let nvDraft = {};        // brouillon des champs "nv-*", survit aux rafraîchissements
let nvFraisRows = { p: [], s: [] };   // lignes de frais dynamiques (Produit / Service)
let nvFraisSeq = 0;
let nvDemSel = { p: new Set(), s: new Set() };   // demandeurs sélectionnés (étiquettes)
let assignDAValue = '';  // valeur courante du select (persiste entre les re-renders)
let splitDAValue = null; // DA choisie dans le panneau « Répartir » (null = pas encore choisie : on reprend assignDAValue)

function fmt(v) { return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(v); }
function toMs(g){ if(!g)return 0; if(g>1e15)return g/1000; if(g>1e11)return g; return g*1000; }
function fmtDate(g){ const ms=toMs(g); if(!ms)return ''; const d=new Date(ms); if(isNaN(d)||d.getFullYear()>3000)return ''; return d.toLocaleDateString('fr-FR'); }

function attachIds(v){
  // Grist attachments via fetchTable: ['L', id1, id2, ...] o null/[]
  if (!v) return [];
  if (Array.isArray(v)) {
    if (v[0] === 'L') return v.slice(1).filter(x => typeof x === 'number');
    return v.filter(x => typeof x === 'number');
  }
  if (typeof v === 'number') return [v];
  return [];
}

function resolveContrat(v){ if(v==null)return''; if(typeof v==='number')return contratNoms[v]||''; if(Array.isArray(v))return contratNoms[v[1]]||''; return String(v); }
function resolveFour(v){ if(v==null)return''; if(typeof v==='number')return fourNoms[v]||''; if(Array.isArray(v))return fourNoms[v[1]]||''; return String(v); }

async function fetchAll() {
  try {
    const [d, c, ct, fo, lb] = await Promise.all([
      grist.docApi.fetchTable('Demandes_achat'),
      grist.docApi.fetchTable('Commandes'),
      grist.docApi.fetchTable('Contrats'),
      grist.docApi.fetchTable('Fournisseurs'),
      grist.docApi.fetchTable('Lignes_budgetaires'),
    ]);

    contratNoms = {};
    contratsList = [];
    contratsMasques = new Set();
    (ct.id||[]).forEach((id,i)=>{
      contratNoms[id]=(ct.Nom||[])[i]||('#'+id);
      contratsList.push({id, nom:contratNoms[id]});
      if((ct.Masquer||[])[i]){ const n=(ct.Nom||[])[i]; if(n) contratsMasques.add(String(n).trim()); }
    });
    fourNoms = {};
    fournisseursList = [];
    (fo.id||[]).forEach((id,i)=>{ fourNoms[id]=(fo.Label||[])[i]||(fo.Fournisseur||[])[i]||(fo.Nom||[])[i]||('#'+id); fournisseursList.push({id, nom:fourNoms[id]}); });
    lignesList = (lb.id||[]).map((id,i)=>({
      id,
      label:(lb.Label||[])[i]||'',
      contrat:(lb.Contrat||[])[i],
      dispo:(typeof (lb.Disponible||[])[i] === 'number') ? (lb.Disponible||[])[i] : null,
      date_dernier_releve:(lb.Date_dernier_releve||[])[i] || null,
    }));

    das = (d.id||[]).map((id,i)=>({
      id,
      num_da:(d.Num_DA||[])[i]||('DA#'+id),
      contrat:resolveContrat((d.Contrat||[])[i]), masque:contratsMasques.has(String(resolveContrat((d.Contrat||[])[i])).trim()),
      ligne:edRid((d.Ligne_budgetaire||[])[i]),
      fournisseur:resolveFour((d.Fournisseur||[])[i]),
      date_da:(d.Date_DA||[])[i],
      date_pgm:(d.Date_OrderPGM||[])[i],
      date_bc:(d.Date_reception_BC||[])[i],
      statut:(d.Statut||[])[i]||'',
      num_bc:(d.Num_BC||[])[i]||'',
      pj:(d.PJ||[])[i]||null,
      bc:(d.BC||[])[i]||null,
      da:(d.DA||[])[i]||null,
      autres:(d.Autres||[])[i]||null,
    }));

    commandes = (c.id||[]).map((id,i)=>({
      id,
      demande_achat:(c.Demande_achat||[])[i]||null,
      designation:(c.Designation2||[])[i]||'',
      ref:(c.Reference_fournisseur||[])[i]||'',
      qte:(c.Quantite||[])[i]||1,
      montant:(c.Montant2||[])[i]||((c.Prix_unitaire_HT||[])[i]||0)*((c.Quantite||[])[i]||1),
      type_article:(c.Type_article||[])[i]||'Produit',
      demandeur:(c.Demandeur||[])[i]||null,
      devise:(c.Devise||[])[i]||'EUR',
      prix:(c.Prix_unitaire_HT||[])[i]||0,
      taux:(c.Taux_change||[])[i]||1,
      code_ghp:(c.Code_GHP||[])[i]||'',
      rep:(c.Repartition||[])[i]||'',
      tva:((c.Taux_TVA||[])[i] !== undefined && (c.Taux_TVA||[])[i] !== null) ? (c.Taux_TVA||[])[i] : 0.2,
      statut_livr:(c.Statut_livraison||[])[i]||'', date_livr:(c.Date_livraison||[])[i],
    }));

    // Index commandes par DA : artsOf() devient une simple consultation (O(1)) au lieu
    // de reparcourir toute la table à chaque appel (ça devenait lent avec beaucoup de DA).
    commandesByDA = new Map();
    commandes.forEach(a => {
      if (a.demande_achat == null) return;
      if (!commandesByDA.has(a.demande_achat)) commandesByDA.set(a.demande_achat, []);
      commandesByDA.get(a.demande_achat).push(a);
    });

    render();
  } catch(e) {
    document.getElementById('container').innerHTML = '<div class="empty">Erreur: '+e.message+'</div>';
  }
}

function setTab(t) {
  tab = t;
  selectedDA = null;
  selectedArts.clear();
  assignDAValue = '';
  render();
}

function goAssignerArticles(daId) {
  preselectDA = daId;
  tab = 'libres';
  selectedDA = null;
  selectedArts.clear();
  render();
}

function choixList(v) {
  // Choix multiple via fetchTable: ['L', 'a', 'b'] o array simple
  if (!v) return [];
  if (Array.isArray(v)) {
    if (v[0] === 'L') return v.slice(1);
    return v;
  }
  return [String(v)];
}

function artsOf(daId) { return commandesByDA.get(daId) || []; }
function totalOf(daId) { return artsOf(daId).reduce((s,a)=>s+a.montant,0); }
function nbProduits(daId) { return artsOf(daId).filter(a=>a.type_article!=='Service' && a.type_article!=='Frais').length; }

function badgeClass(statut) {
  if (statut === 'En cours') return 'b-cours';
  if (statut === 'Envoyée PGM') return 'b-pgm';
  if (statut === 'BC reçu') return 'b-bc';
  return 'b-cours';
}

function render() {
  if (tab === 'nouvelle') { renderFrame(renderNewDAContent()); return; }
  if (tab === 'libres') { renderFrame(renderLibresContent()); return; }
  if (tab === 'nouvel') { renderFrame(renderNouvelContent()); return; }
  renderFrame(renderListContent());
}

// Marc comú: botó Nouvelle DA (esquerra) + filtres (a sobre de la columna central)
function renderFrame(centerAndRight) {
  const container = document.getElementById('container');
  container.innerHTML = `
    <div class="layout">
      <div class="panel">
        <div class="cards-row">
          <div class="nouvel-card ${tab==='nouvel'?'active':''}" onclick="setTab('nouvel')">
            <div class="nouvel-icon">＋</div>
            <div>
              <div class="new-da-title">Nouvel élément</div>
              <div class="new-da-sub">Produit, service ou mouvement</div>
            </div>
          </div>
          <div class="new-da-card ${tab==='nouvelle'?'active':''}" onclick="openNewDA()">
            <div class="new-da-icon">+</div>
            <div>
              <div class="new-da-title">Nouvelle DA</div>
              <div class="new-da-sub">Créer une demande d'achat</div>
            </div>
          </div>
          <div class="libres-card ${tab==='libres'?'active':''}" onclick="setTab('libres')">
            <div class="libres-icon">📋</div>
            <div>
              <div class="new-da-title">Articles libres</div>
              <div class="new-da-sub">Assigner des articles à une DA</div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel" style="grid-column: span 2;">
        <div class="toolbar">
          <button class="tab ${tab==='toutes'?'active':''}" onclick="setTab('toutes')">Toutes</button>
          <button class="tab ${tab==='En cours'?'active':''}" onclick="setTab('En cours')">En cours</button>
          <button class="tab ${tab==='Envoyée PGM'?'active':''}" onclick="setTab('Envoyée PGM')">Envoyée PGM</button>
          <button class="tab ${tab==='BC reçu'?'active':''}" onclick="setTab('BC reçu')">BC reçu</button>
          <div class="bc-search">
            <input type="text" id="bc-search-input" placeholder="🔍 BC, article, réf…" value="${searchBC.replace(/"/g,'&quot;')}" oninput="onSearchBC(this.value)">
          </div>
        </div>
        <div class="frame-content">${centerAndRight}</div>
      </div>
    </div>`;
}

// Contingut de la vista llista (columna llista + detall)
function renderListContent() {
  let list = das.slice().filter(d => d.statut !== 'Annulée' && !d.masque);
  if (tab !== 'toutes') list = list.filter(d => d.statut === tab);
  if (filterFour) list = list.filter(d => d.fournisseur === filterFour);
  if (filterDem) list = list.filter(d => demandeursOfDA(d.id).has(filterDem));
  if (searchBC.trim()) list = list.filter(d => daMatchesQuery(d, searchBC));
  const dateRef = (d) => {
    // A "Toutes": toujours par Date_DA (chronologie de création)
    if (tab === 'toutes') return toMs(d.date_da);
    // Sinon: date pertinente selon le statut
    if (d.statut === 'Envoyée PGM' || d.statut === 'BC reçu') return toMs(d.date_bc) || toMs(d.date_pgm) || toMs(d.date_da);
    return toMs(d.date_da);
  };
  list.sort((a,b) => dateRef(b) - dateRef(a));

  const nbLibres = commandes.filter(c => !c.demande_achat).length;

  // Desplegable de proveïdors (només els que apareixen en alguna DA)
  const foursPresents = [...new Set(das.map(d => d.fournisseur).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, 'fr', {sensitivity:'base'}));
  const fourOptions = '<option value="">Tous les fournisseurs</option>' +
    foursPresents.map(f => `<option value="${f.replace(/"/g,'&quot;')}" ${filterFour===f?'selected':''}>${f}</option>`).join('');

  // Demandeurs presents en algun article
  const demsPresents = [...new Set(commandes.flatMap(c => choixList(c.demandeur)))]
    .filter(Boolean).sort((a,b) => a.localeCompare(b, 'fr', {sensitivity:'base'}));
  const demOptions = '<option value="">Tous les demandeurs</option>' +
    demsPresents.map(x => `<option value="${x.replace(/"/g,'&quot;')}" ${filterDem===x?'selected':''}>${x}</option>`).join('');

  let listHtml = '';
  list.forEach(d => {
    const sel = selectedDA === d.id ? 'sel' : '';
    const nb = nbProduits(d.id);
    const dProds = artsOf(d.id).filter(a => a.statut_livr === 'Reçu' || a.statut_livr === 'En attente');
    const nbRecus = dProds.filter(a => a.statut_livr === 'Reçu').length;
    let livrBadge = '';
    if (dProds.length && (d.statut === 'Envoyée PGM' || d.statut === 'BC reçu')) {
      const tous = nbRecus === dProds.length;
      const cls = tous ? 'all' : (nbRecus > 0 ? 'partial' : 'none');
      livrBadge = `<span class="da-livr ${cls}">${nbRecus}/${dProds.length} livrés</span>`;
    }
    listHtml += `
      <div class="da-item ${sel}" data-da="${d.id}" onclick="selectDA(${d.id})">
        <div class="da-item-top"><span class="da-item-num">${d.num_da}</span><span class="badge ${badgeClass(d.statut)}">${d.statut}</span></div>
        <div class="da-item-meta">${d.contrat || '—'} → ${d.fournisseur || '—'}</div>
        <div class="da-item-foot"><span style="color:#999">${listCountLabel(d.id)} · ${(d.statut==='Envoyée PGM'||d.statut==='BC reçu') ? 'PGM '+fmtDate(d.date_pgm) : fmtDate(d.date_da)}</span><span class="da-item-total">${fmt(totalOf(d.id))}</span></div>
        ${livrBadge ? `<div class="da-item-livr">${livrBadge}</div>` : ''}
      </div>`;
  });
  if (!listHtml) listHtml = '<div class="empty">Aucune DA.</div>';

  let detailHtml;
  if (selectedDA) {
    const d = das.find(x => x.id === selectedDA);
    detailHtml = renderDetail(d);
  } else {
    detailHtml = '<div class="empty">Sélectionnez une DA pour voir le détail.</div>';
  }

  return `
    <div class="inner-layout">
      <div>
        <div class="panel-title">Demandes d'achat (${list.length})${nbLibres ? ' · ' + nbLibres + ' art. libres' : ''}</div>
        <div class="filters-row">
          <select class="four-filter" onchange="setFilterFour(this.value)">${fourOptions}</select>
          <select class="four-filter" onchange="setFilterDem(this.value)">${demOptions}</select>
        </div>
        <div class="da-list">${listHtml}</div>
      </div>
      <div>
        <div class="panel-title">Détail</div>
        ${detailHtml}
      </div>
    </div>`;
}

function renderDetail(d) {
  if (!d) return '<div class="empty">DA introuvable.</div>';
  const arts = artsOf(d.id);
  const total = totalOf(d.id);
  const nbProd = arts.filter(a=>a.type_article!=='Service' && a.type_article!=='Frais').length;
  const nbServ = arts.filter(a=>a.type_article==='Service').length;
  const nbFrais = arts.filter(a=>a.type_article==='Frais').length;

  let artsHtml = arts.length ? arts.map(a => {
    const dems = choixList(a.demandeur);
    const demHtml = dems.length ? `<div class="art-dem">${dems.map(x=>`<span class="dem-tag">${x}</span>`).join('')}</div>` : '';
    let deviseHtml = '';
    if (a.devise && a.devise !== 'EUR') {
      const origTotal = (a.prix || 0) * (a.qte || 1);
      const symbols = { USD: '$', GBP: '£', CHF: 'CHF ', JPY: '¥' };
      const sym = symbols[a.devise] || (a.devise + ' ');
      const origStr = a.devise === 'USD' || a.devise === 'GBP'
        ? sym + origTotal.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2})
        : origTotal.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ' + a.devise;
      deviseHtml = `<div class="art-devise">${origStr} → ${fmt(a.montant)} (taux ${a.taux}). Valeur estimée en EUR.</div>`;
    }
    const livr = a.statut_livr === 'Reçu';
    const hasLivr = a.statut_livr === 'Reçu' || a.statut_livr === 'En attente';
    const livrDate = livr && a.date_livr ? ' ' + fmtDate(a.date_livr) : '';
    const livrHtml = !hasLivr
      ? ''
      : `<span class="art-livr ${livr?'recu':'attente'}">${livr?'✓ Livré'+livrDate:'⏳ En attente'}</span>`;
    return `
    <div class="art ${a.type_article==='Frais'?'svc':''}">
      <div class="art-namecol">
        <span class="art-name">${a.qte>1?a.qte+'× ':''}${highlightMatch(a.designation||'(sans nom)', searchBC)}${a.ref && a.type_article!=='Service' && a.type_article!=='Frais'?` <span class="art-ref">(Réf. ${highlightMatch(a.ref, searchBC)})</span>`:''}</span>
        ${deviseHtml}
        ${repHtml(a)}
      </div>
      <div class="art-side">
        ${livrHtml}<span class="art-price">${fmt(a.montant)}</span>
        <span class="art-btns">
          <button class="btn-art-edit" onclick="openEdit('com',${a.id})">✎ Modifier</button>
          <button class="btn-art-del" onclick="openEdit('del',${a.id})">🗑 Supprimer</button>
        </span>
        <div class="art-dem-col">${demHtml}</div>
      </div>
    </div>${edInline('com', a.id)}${edInline('del', a.id)}${edInline('merge', a.id)}`;
  }).join('') : '<div class="empty">Aucun article.</div>';

  const parts = [];
  if (nbProd) parts.push(`${nbProd} article(s)`);
  if (nbServ) parts.push(`${nbServ} service(s)`);
  if (nbFrais) parts.push(`${nbFrais} frais`);
  const footLabel = parts.join(' + ') || '0 article(s)';

  // Divisa de la DA (si tots els articles són en la mateixa devise non-EUR)
  const devises = [...new Set(arts.map(a => a.devise || 'EUR'))];
  const daDevise = devises.length === 1 ? devises[0] : 'EUR';
  let totalDeviseHtml = '';
  if (daDevise !== 'EUR' && arts.length) {
    const origTotal = arts.reduce((s,a) => s + (a.prix||0)*(a.qte||1), 0);
    const symbols = { USD: '$', GBP: '£', CHF: 'CHF ', JPY: '¥' };
    const sym = symbols[daDevise] || (daDevise + ' ');
    const origStr = (daDevise === 'USD' || daDevise === 'GBP')
      ? sym + origTotal.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2})
      : origTotal.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ' + daDevise;
    totalDeviseHtml = `<div class="total-devise">${origStr} → ${fmt(total)}. Valeur estimée en EUR.</div>`;
  }

function toggleDelete(id) {

async function deleteDA(id, mode) {
  // mode : 'libres' = supprimer la DA, ses articles redeviennent libres
  //        'tout'   = supprimer la DA et ses articles
  //        'annuler'= ne rien supprimer : la DA passe à « Annulée » (n° libéré), articles rattachés (trace)
  try {
    const da = das.find(x => x.id === id);
    const arts = commandes.filter(c => c.demande_achat === id);
    const actions = [];

    if (mode === 'libres') {
      if (arts.length) {
        actions.push(['BulkUpdateRecord', 'Commandes', arts.map(a => a.id), { Demande_achat: arts.map(() => null) }]);
      }
      actions.push(['RemoveRecord', 'Demandes_achat', id]);
    } else if (mode === 'tout') {
      arts.forEach(a => actions.push(['RemoveRecord', 'Commandes', a.id]));
      actions.push(['RemoveRecord', 'Demandes_achat', id]);
    } else if (mode === 'annuler') {
      // Marquer la DA comme annulée + libérer le numéro (suffixe -ANN)
      const numOrig = da ? String(da.num_da) : '';
      const numAnn = numOrig.endsWith('-ANN') ? numOrig : numOrig + '-ANN';
      actions.push(['UpdateRecord', 'Demandes_achat', id, { Statut: 'Annulée', Num_DA: numAnn }]);
    } else {
      throw new Error('Action inconnue.');
    }

    const msg = document.getElementById('del-msg-' + id);
    if (msg) { msg.className = 'msg'; msg.textContent = 'En cours…'; }
    await grist.docApi.applyUserActions(actions);
    if (mode !== 'annuler') {
      arts.forEach(a => { selectedArts.delete(a.id); if (splitArticleId === a.id) splitArticleId = null; });
    }
    selectedDA = null;
    await fetchAll();
  } catch(e) {
    const msg = document.getElementById('del-msg-' + id);
    if (msg) { msg.className = 'msg err'; msg.textContent = 'Erreur : ' + e.message; }
    else alert('Erreur : ' + e.message);
  }
}

// Champ Grist (ex. "PJ") -> clé locale correspondante dans das[] (ex. "pj")
const CHAMP_VERS_CLE = { PJ: 'pj', BC: 'bc', DA: 'da', Autres: 'autres' };

async function handleFileUpload(inputEl, daId, champ) {
  const file = inputEl.files[0];
  inputEl.value = '';   // permet de re-choisir le même fichier une prochaine fois
  if (!file) return;
  const btn = document.getElementById('add-' + champ);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    // 1. Jeton avec droits d'écriture
    const tokenInfo = await grist.docApi.getAccessToken({ readOnly: false });
    // 2. Envoi du fichier (stocké, pas encore lié à une ligne)
    const formData = new FormData();
    formData.append('upload', file, file.name);
    const response = await fetch(`${tokenInfo.baseUrl}/attachments?auth=${tokenInfo.token}`, {
      method: 'POST',
      body: formData,
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    });
    if (!response.ok) throw new Error('Échec de l\'envoi (' + response.status + ')');
    const result = await response.json();
    const newId = result[0];
    // 3. Lier le nouveau fichier à la DA, en gardant ceux déjà présents
    const da = das.find(x => x.id === daId);
    const existants = da ? attachIds(da[CHAMP_VERS_CLE[champ]]) : [];
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Demandes_achat', daId, { [champ]: ['L', ...existants, newId] }]
    ]);
    await fetchAll();
  } catch (e) {
    alert("Impossible d'ajouter le fichier : " + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '＋'; }
  }
}

async function openAttachment(attId) {
  try {
    const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
    const url = `${tokenInfo.baseUrl}/attachments/${attId}/download?auth=${tokenInfo.token}&inline=true`;
    window.open(url, '_blank');
  } catch(e) {
    alert('Impossible d\'ouvrir le fichier : ' + e.message);
  }
}

async function confirmSplitAssign(articleId) {
  const article = commandes.find(c => c.id === articleId);
  const montantInput = document.getElementById('split-montant-' + articleId);
  const daSel = document.getElementById('split-da-' + articleId);
  const msg = document.getElementById('split-msg-' + articleId);
  if (!article || !montantInput || !daSel) return;

  const daId = daSel.value;
  const montantSaisi = parseFloat(montantInput.value);

  if (!daId) {
    msg.className = 'msg err'; msg.textContent = 'Choisissez une DA de destination.'; return;
  }
  if (!(montantSaisi > 0)) {
    msg.className = 'msg err'; msg.textContent = 'Montant invalide.'; return;
  }
  if (montantSaisi > article.montant + 0.005) {
    msg.className = 'msg err'; msg.textContent = 'Le montant dépasse le total de l\'article.'; return;
  }

  msg.className = 'msg'; msg.textContent = 'Enregistrement…';

  try {
    const estQuasiTotal = Math.abs(montantSaisi - article.montant) < 0.01;

    if (estQuasiTotal) {
      // Montant ≈ total : simple assignation complète, sans division
      await grist.docApi.applyUserActions([
        ['UpdateRecord', 'Commandes', articleId, { Demande_achat: Number(daId) }]
      ]);
      splitArticleId = null;
      selectedArts.delete(articleId);
      tab = 'En cours';
      selectedDA = Number(daId);
      await fetchAll();
      return;
    }

    // Répartition partielle : créer une copie pour la part assignée,
    // et réduire l'article d'origine du montant restant (il reste libre).
    // Calcul par proportion sur le prix unitaire d'origine : valable quelle que
    // soit la devise (le montant affiché est en €, le prix unitaire dans la devise).
    const qte = article.qte || 1;
    const ratio = montantSaisi / article.montant;
    const prixBase = article.prix > 0 ? article.prix : (article.montant / qte / (article.taux || 1));
    const arrondi = v => qte === 1 ? Math.round(v * 100) / 100 : Math.round(v * 1e6) / 1e6;
    const prixCopie = arrondi(prixBase * ratio);
    const prixRestant = arrondi(prixBase - prixCopie);

    // Traçabilité : les deux parts partagent une clé de répartition (colonne « Repartition »)
    const repKey = article.rep || ('REP-' + articleId);
    const tagged = await edEnsureRepartition();

    await grist.docApi.applyUserActions([
      ['AddRecord', 'Commandes', null, {
        Designation2: article.designation,
        Reference_fournisseur: article.ref,
        Code_GHP: article.code_ghp,
        Devise: article.devise,
        Taux_change: article.taux,
        Quantite: qte,
        Prix_unitaire_HT: prixCopie,
        Taux_TVA: article.tva,

function nextNumDA() {
  // Buscar el número més alt existent i sumar 1 (ignorant les DA annulées)
  let maxN = 0;
  das.forEach(d => {
    if (d.statut === 'Annulée' || String(d.num_da).endsWith('-ANN')) return;
    const m = String(d.num_da).match(/(\d+)/);
    if (m) { const n = parseInt(m[1], 10); if (n > maxN) maxN = n; }
  });
  const next = maxN + 1;
  return 'DA-' + String(next).padStart(3, '0');
}

function onNewContratChange() {
  const contratId = document.getElementById('new-contrat').value;
  const sel = document.getElementById('new-ligne');
  if (!contratId) {
    sel.innerHTML = '<option value="">— Choisir d\'abord un contrat —</option>';
    sel.disabled = true;
    return;
  }
  // Filtrar línies del contracte seleccionat
  const lignesContrat = lignesList.filter(l => {
    const c = l.contrat;
    const cid = typeof c === 'number' ? c : (Array.isArray(c) ? c[1] : null);
    return cid == contratId;
  }).sort((a, b) => {
    const CAT = ['Fonctionnement', 'Équipement', 'Personnel', 'Prestation', 'Mission'];
    const ord = lbl => {
      const s = String(lbl); let cat = CAT.findIndex(c => s.includes(c)); if (cat < 0) cat = 99;
      const low = s.toLowerCase(); const rang = low.includes('indirect') ? 1 : (low.includes('direct') ? 0 : 2);
      return [cat, rang, low];
    };
    const oa = ord(a.label), ob = ord(b.label);
    if (oa[0] !== ob[0]) return oa[0] - ob[0];
    if (oa[1] !== ob[1]) return oa[1] - ob[1];
    return oa[2].localeCompare(ob[2], 'fr');
  });
  sel.disabled = false;
  sel.innerHTML = '<option value="">— Choisir —</option>' +
    lignesContrat.map(l => {
      const parts = l.label.split('|');
      const sub = parts.length > 1 ? parts.slice(1).join('|').trim() : l.label;
      return `<option value="${l.id}">${sub}</option>`;
    }).join('');
}

// =====================================================================
// ÉDITION / SUPPRESSION D'UNE DA OU D'UN ARTICLE — panneaux EN LIGNE.
// L'état vit dans edCtx : les panneaux sont réinsérés par les fonctions de
// rendu via edInline(), donc ils survivent à un rafraîchissement, et ce que
// l'on a saisi (brouillon) est conservé. Seuls les champs modifiés sont écrits.
// =====================================================================
const ED_STATUTS = ['En cours', 'Envoyée PGM', 'BC reçu'];
const ED_TYPES = ['Produit', 'Service', 'Frais'];
let edCtx = null;   // { kind: 'da' | 'com' | 'del', id, orig, draft: {} }

function edEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function edRid(v) { if (v == null) return null; if (typeof v === 'number') return v; if (Array.isArray(v)) return v[1] || null; return null; }
function edIso(v) { const ms = toMs(v); if (!ms) return ''; const d = new Date(ms); if (isNaN(d) || d.getFullYear() > 3000) return ''; return d.toISOString().slice(0, 10); }
function edEpoch(s) { return s ? Math.floor(new Date(s + 'T00:00:00Z').getTime() / 1000) : null; }
function edVal(id) { const el = document.getElementById(id); return el ? el.value : ''; }
function edMsg(txt, cls) { const m = document.getElementById('ed-msg'); if (m) { m.className = 'ed-msg ' + (cls || ''); m.textContent = txt || ''; } }
function edDv(id, def) { return (edCtx && edCtx.draft && Object.prototype.hasOwnProperty.call(edCtx.draft, id)) ? edCtx.draft[id] : def; }

// Brouillon : on mémorise ce qui est saisi, pour ne rien perdre si la vue est redessinée
function edCapture(e) {
  const t = e.target;
  if (edCtx && edCtx.draft && t && t.id && /^(ed|ec)-/.test(t.id) && t.id !== 'ed-msg') edCtx.draft[t.id] = t.value;
}
document.addEventListener('input', edCapture, true);
document.addEventListener('change', edCapture, true);

function edRefresh() {
  render();
  setTimeout(() => { const p = document.getElementById('ed-panel'); if (p && p.scrollIntoView) p.scrollIntoView({ block: 'nearest' }); }, 0);
}
function edClose() { edCtx = null; render(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('ed-panel')) edClose(); });

async function openEdit(kind, id) {
  try {
    if (kind === 'da') await edOpenDA(id);
    else if (kind === 'del') edOpenDelete(id);
    else if (kind === 'newda') edOpenNewDA();
    else if (kind === 'merge') edOpenMerge(id);
    else await edOpenCom(id);
  } catch (e) {
    alert('Erreur : ' + e.message);
  }
}

// Appelée par les fonctions de rendu : renvoie le panneau s'il concerne cet élément
function edInline(kind, id) {
  try {
    if (!edCtx || edCtx.kind !== kind || edCtx.id !== id) return '';
    return edPanelHtml();
  } catch (e) { return ''; }
}

// ---------- DA ----------
// =====================================================================
// NOUVEL ÉLÉMENT : Produit / Service (article libre, comme « Articles libres »)
// ou Mouvement (écrit dans Mouvements, hors circuit DA). Panneau indépendant
// de edCtx, avec son propre brouillon (nvDraft) qui survit aux rafraîchissements.
// =====================================================================
function nvCapture(e) {
  const t = e.target;
  if (t && t.id && /^nv-/.test(t.id)) nvDraft[t.id] = t.value;
}
document.addEventListener('input', nvCapture, true);
document.addEventListener('change', nvCapture, true);
function nvVal(id, def) {
  return Object.prototype.hasOwnProperty.call(nvDraft, id) ? nvDraft[id] : (def == null ? '' : def);
}
function nvMsg(which, text, cls) {
  const m = document.getElementById('nv-msg-' + which);
  if (m) { m.className = 'ed-msg ' + (cls || ''); m.textContent = text || ''; }
}

function setNouvelType(t) { nouvelType = t; render(); }
function nvSetMvtType(t) { nvDraft['nv-m-type'] = t; render(); }
function nvCancel() { nouvelType = null; render(); }

// Ligne budgétaire groupée par contrat (optgroups), tous contrats confondus —
// utilisée par le formulaire Mouvement, qui n'est rattaché à aucun contrat précis.
function edLigneOptionsGrouped(selectedId) {
  const CAT = ['Fonctionnement', 'Équipement', 'Personnel', 'Prestation', 'Mission'];
  const rang = l => { const i = CAT.findIndex(c => String(l.label).includes(c)); return i < 0 ? 99 : i; };
  const groups = {};
  lignesList.forEach(l => {
    const contrat = (String(l.label).split('|')[0] || '').trim();
    if (contratsMasques.has(contrat)) return;
    (groups[contrat] = groups[contrat] || []).push(l);
  });
  let html = '<option value="">— Choisir —</option>';
  Object.keys(groups).sort((a, b) => a.localeCompare(b, 'fr')).forEach(c => {
    html += `<optgroup label="${edEsc(c)}">`;
    groups[c].slice().sort((a, b) => rang(a) - rang(b) || String(a.label).localeCompare(String(b.label), 'fr')).forEach(l => {
      const sub = String(l.label).includes('|') ? String(l.label).split('|').slice(1).join('|').trim() : l.label;
      html += `<option value="${l.id}" ${l.id === selectedId ? 'selected' : ''}>${edEsc(sub)}</option>`;
    });
    html += '</optgroup>';
  });
  return html;
}

// ---------- Remplissage automatique depuis une référence déjà connue ----------
function nvRefsMap() {
  const map = {};
  commandes.forEach(c => {
    if (!c.ref || c.type_article === 'Frais') return;
    const key = String(c.ref).trim().toLowerCase();
    if (!map[key] || c.id > map[key].id) {
      map[key] = { id: c.id, ref: String(c.ref).trim(), desig: c.designation || '', ghp: c.code_ghp || '', prix: c.prix, devise: c.devise || 'EUR', taux: c.taux || 1 };
    }
  });
  return map;
}
function nvRefSuggestionsHtml() {
  return Object.values(nvRefsMap())
    .sort((a, b) => a.ref.localeCompare(b.ref, 'fr'))
    .map(r => `<option value="${edEsc(r.ref)}">${edEsc((r.desig || '').slice(0, 60))}</option>`)
    .join('');
}
function nvOnRefChange(which) {
  const input = document.getElementById('nv-' + which + '-ref');
  const key = input.value.trim().toLowerCase();
  if (!key) return;
  const m = nvRefsMap()[key];
  if (!m) return;   // référence inconnue : on ne touche à rien
  const remplis = [];
  const setIfEmpty = (id, val) => {
    const el = document.getElementById(id);
    if (el && !el.value.trim() && val !== '' && val != null) { el.value = val; nvDraft[id] = el.value; return true; }
    return false;
  };
  if (setIfEmpty('nv-' + which + '-desig', m.desig)) remplis.push('désignation');
  if (setIfEmpty('nv-' + which + '-ghp', m.ghp)) remplis.push('code GHP');
  if (setIfEmpty('nv-' + which + '-prix', m.prix)) remplis.push('prix');
  if (which === 'p') {
    const devEl = document.getElementById('nv-p-devise'), tauxEl = document.getElementById('nv-p-taux');
    if (devEl && devEl.value === 'EUR' && m.devise && m.devise !== 'EUR') {
      devEl.value = m.devise; nvDraft['nv-p-devise'] = m.devise;
      if (tauxEl && (tauxEl.value === '1' || !tauxEl.value.trim())) { tauxEl.value = m.taux; nvDraft['nv-p-taux'] = String(m.taux); }
      remplis.push('devise');
    }
  }
  if (remplis.length) nvMsg(which, 'Rempli depuis une commande précédente (' + remplis.join(', ') + ').', 'ok');
}

// ---------- Demandeurs sous forme d'étiquettes cliquables ----------
function nvDemandeursDispo() {
  const set = new Set();
  commandes.forEach(c => choixList(c.demandeur).forEach(d => { if (d) set.add(d); }));

function nvDemBoxHtml(which) {
  const dispo = nvDemandeursDispo();
  if (!dispo.length) return '<span class="ed-hint">Aucun demandeur enregistré</span>';
  const sel = nvDemSel[which];
  return dispo.map((d, i) => `<span class="nv-dem-chip ${sel.has(d) ? 'sel' : ''}" onclick="nvToggleDem('${which}', ${i})">${edEsc(d)}</span>`).join('');
}
function nvToggleDem(which, idx) {
  const d = nvDemandeursDispo()[idx];
  if (!d) return;
  const sel = nvDemSel[which];
  if (sel.has(d)) sel.delete(d); else sel.add(d);

function nvShowRecap(which, title, detail) {
  const el = document.getElementById('nv-recap-' + which);

  el.innerHTML = `<span class="nv-recap-check">✓</span>${edEsc(title)}` + (detail ? `<div class="nv-recap-detail">${edEsc(detail)}</div>` : '');

}

// ---------- Effacer : vide le formulaire courant sans fermer le panneau ----------
function nvEffacer(which) {
  Object.keys(nvDraft).forEach(k => { if (k.startsWith('nv-' + which + '-')) delete nvDraft[k]; });
  if (nvFraisRows[which]) nvFraisRows[which] = [];
  if (nvDemSel[which]) nvDemSel[which] = new Set();
  const recap = document.getElementById('nv-recap-' + which);
  if (recap) { recap.classList.remove('show'); recap.innerHTML = ''; }
  render();
}

async function nvSubmitProduit() {
  const ref = nvVal('nv-p-ref').trim();
  const ghp = nvVal('nv-p-ghp').trim();
  const desig = nvVal('nv-p-desig').trim();
  const prix = parseFloat(nvVal('nv-p-prix'));

  const devise = nvVal('nv-p-devise', 'EUR') || 'EUR';
  const taux = parseFloat(nvVal('nv-p-taux')) || 1;
  if (!desig) { nvMsg('p', 'La désignation est obligatoire.', 'err'); return; }
  if (!isFinite(prix) || prix < 0) { nvMsg('p', 'Le prix unitaire est obligatoire.', 'err'); return; }

  const demList = [...nvDemSel.p];
  const demValue = demList.length ? ['L', ...demList] : null;
  const frais = nvFraisCollect('p');

  const actions = [['AddRecord', 'Commandes', null, {
    Reference_fournisseur: ref, Code_GHP: ghp, Designation2: desig,
    Prix_unitaire_HT: prix, Quantite: qte, Devise: devise, Taux_change: taux,
    Taux_TVA: 0.2, Type_article: 'Produit', Demandeur: demValue,
  }]];
  frais.forEach(f => actions.push(['AddRecord', 'Commandes', null, {
    Reference_fournisseur: ref, Code_GHP: ghp, Designation2: f.type,
    Prix_unitaire_HT: f.montant, Quantite: 1, Devise: devise, Taux_change: taux,
    Taux_TVA: 0.2, Type_article: 'Frais', Demandeur: demValue,
  }]));

  const btn = document.getElementById('nv-save-p');
  try {
    if (btn) btn.disabled = true;
    nvMsg('p', 'Enregistrement…', '');
    await grist.docApi.applyUserActions(actions);
    const symP = devise === 'USD' ? '$' : '€';
    const prixTxt = devise === 'USD' ? prix.toFixed(2) + ' $' : fmt(prix);
    let detailP = qte + ' × ' + prixTxt;
    if (demList.length) detailP += ' · ' + demList.join(', ');
    if (frais.length) detailP += ' · ' + frais.length + ' frais (' + frais.map(f => f.type).join(', ') + ')';
    Object.keys(nvDraft).forEach(k => { if (k.startsWith('nv-p-')) delete nvDraft[k]; });
    nvFraisRows.p = []; nvDemSel.p = new Set();
    await fetchAll();
    nvShowRecap('p', desig, detailP);
    nvMsg('p', (1 + frais.length) + ' ligne(s) enregistrée(s).', 'ok');
  } catch (e) {
    if (btn) btn.disabled = false;
    nvMsg('p', 'Erreur : ' + e.message, 'err');
  }
}

function edLigneOptions(contratId, selectedId) {
  const CAT = ['Fonctionnement', 'Équipement', 'Personnel', 'Prestation', 'Mission'];
  const rang = l => { const i = CAT.findIndex(c => String(l.label).includes(c)); return i < 0 ? 99 : i; };
  const lignes = lignesList.filter(l => contratId != null && edRid(l.contrat) === contratId)
    .sort((a, b) => rang(a) - rang(b) || String(a.label).localeCompare(String(b.label), 'fr'));
  let html = '<option value="">— Choisir —</option>';
  lignes.forEach(l => {
    const parts = String(l.label).split('|');
    const sub = parts.length > 1 ? parts.slice(1).join('|').trim() : l.label;
    html += `<option value="${l.id}" ${l.id === selectedId ? 'selected' : ''}>${edEsc(sub)}</option>`;
  });
  return html;
}

function edOnContrat() {
