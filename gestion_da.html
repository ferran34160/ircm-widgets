async function edSaveDA() {
  const o = edCtx.orig, f = {};
  const contrat = edVal('ed-contrat') ? Number(edVal('ed-contrat')) : null;
  const ligne = edVal('ed-ligne') ? Number(edVal('ed-ligne')) : null;
  const four = edVal('ed-four') ? Number(edVal('ed-four')) : null;
  if (!contrat || !ligne || !four) { edMsg('Contrat, ligne et fournisseur sont obligatoires.', 'err'); return null; }
  if (contrat !== o.contrat) f.Contrat = contrat;
  if (ligne !== o.ligne) f.Ligne_budgetaire = ligne;
  if (four !== o.four) f.Fournisseur = four;
  if (edVal('ed-statut') !== o.statut) f.Statut = edVal('ed-statut');
  if (edVal('ed-date-da') !== o.date_da) f.Date_DA = edEpoch(edVal('ed-date-da'));
  if (edVal('ed-date-pgm') !== o.date_pgm) f.Date_OrderPGM = edEpoch(edVal('ed-date-pgm'));
  if (edVal('ed-date-bc') !== o.date_bc) f.Date_reception_BC = edEpoch(edVal('ed-date-bc'));
  if (edVal('ed-num-bc').trim() !== String(o.num_bc).trim()) f.Num_BC = edVal('ed-num-bc').trim();
  return { table: 'Demandes_achat', fields: f };
}

async function edSaveCom() {
  const o = edCtx.orig, f = {};
  const qte = parseFloat(edVal('ec-qte')), prix = parseFloat(edVal('ec-prix'));
  if (!isFinite(qte) || qte <= 0) { edMsg('Quantité invalide.', 'err'); return null; }
  if (!isFinite(prix) || prix < 0) { edMsg('Prix invalide.', 'err'); return null; }
  if (edVal('ec-desig') !== o.designation) f.Designation2 = edVal('ec-desig');
  if (edVal('ec-ref') !== o.ref) f.Reference_fournisseur = edVal('ec-ref');
  if (edVal('ec-ghp') !== o.ghp) f.Code_GHP = edVal('ec-ghp');
  if (qte !== o.qte) f.Quantite = qte;
  if (prix !== o.prix) f.Prix_unitaire_HT = prix;
  if (edVal('ec-type') !== o.type) f.Type_article = edVal('ec-type');
  const demTxt = edVal('ec-dem').split(',').map(s => s.trim()).filter(Boolean);
  if (demTxt.join(', ') !== o.dem) {
    f.Demandeur = demTxt.length ? (o.demIsList ? ['L', ...demTxt] : demTxt.join(', ')) : null;
  }
  return { table: 'Commandes', fields: f };
}

async function edSave() {
  if (!edCtx || edCtx.kind === 'del') return;
  const btn = document.getElementById('ed-save');
  try {
    const res = edCtx.kind === 'da' ? await edSaveDA() : await edSaveCom();
    if (!res) return;  // validation refusée (message déjà affiché)
    if (!Object.keys(res.fields).length) { edMsg('Aucune modification.', ''); return; }
    if (btn) btn.disabled = true;
    edMsg('Enregistrement…', '');
    await grist.docApi.applyUserActions([['UpdateRecord', res.table, edCtx.id, res.fields]]);
    edCtx = null;
    await fetchAll();
  } catch (e) {
    if (btn) btn.disabled = false;
    edMsg('Erreur : ' + e.message, 'err');
  }
}

async function edDelete() {
  if (!edCtx || edCtx.kind !== 'del') return;
  const btn = document.getElementById('ed-save');
  const id = edCtx.id;
  try {
    if (btn) btn.disabled = true;
    edMsg('Suppression…', '');
    await grist.docApi.applyUserActions([['RemoveRecord', 'Commandes', id]]);
    selectedArts.delete(id);
    if (splitArticleId === id) splitArticleId = null;
    edCtx = null;
    await fetchAll();
  } catch (e) {
    if (btn) btn.disabled = false;
    edMsg('Erreur : ' + e.message, 'err');
  }
}

// =====================================================================
// AMÉLIORATIONS : recherche, disponible de la ligne, DA depuis la sélection,
// traçabilité des répartitions. Bloc indépendant, appelé par les fonctions de rendu.
// =====================================================================

// ---------- Recherche (BC, N° DA, désignation, référence ; insensible aux accents) ----------
function normTxt(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function artMatchesQuery(a, q) { return normTxt(a.designation).includes(q) || normTxt(a.ref).includes(q); }

// Souligne dans `text` la portion qui correspond à la recherche en cours (searchBC),
// pour repérer d'un coup d'œil l'article qui a fait remonter la DA dans les résultats.
function highlightMatch(text, query) {
  const escaped = edEsc(text || '');
  const q = String(query || '').trim();
  if (!q) return escaped;
  const reQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return escaped.replace(new RegExp('(' + reQ + ')', 'gi'), '<u>$1</u>'); }
  catch (e) { return escaped; }
}
function daMatchesQuery(d, raw) {
  const q = normTxt(String(raw || '').trim());
  if (!q) return true;
  if (normTxt(d.num_bc).includes(q) || normTxt(d.num_da).includes(q)) return true;
  return artsOf(d.id).some(a => artMatchesQuery(a, q));
}
function libresVisibles() {
  const tous = commandes.filter(c => !c.demande_achat);
  const q = normTxt(String(searchBC || '').trim());
  return q ? tous.filter(a => artMatchesQuery(a, q)) : tous;
}
function selSum() { return commandes.filter(c => !c.demande_achat && selectedArts.has(c.id)).reduce((t, a) => t + (a.montant || 0), 0); }

// ---------- Recompte dans la liste des DA (articles + services + frais) ----------
function listCountLabel(daId) {
  const arts = artsOf(daId);
  const nbServ = arts.filter(a => a.type_article === 'Service').length;
  const nbFrais = arts.filter(a => a.type_article === 'Frais').length;
  const nbProd = arts.length - nbServ - nbFrais;
  const p = [];
  if (nbProd) p.push(nbProd + ' art.');
  if (nbServ) p.push(nbServ + ' serv.');
  if (nbFrais) p.push(nbFrais + ' frais');
  return p.join(' + ') || '0 art.';
}

// ---------- Disponible de la ligne budgétaire (avant d'assigner) ----------
function autresEnCoursLigne(ligneId, exceptDaId) {
  return das.filter(d => d.ligne === ligneId && d.statut === 'En cours' && d.id !== exceptDaId).reduce((t, d) => t + totalOf(d.id), 0);
}
function dispoInfoCore(ligneId, dejaDA, ajout, labelAjout, autresEnCours, compte = true) {
  const lg = lignesList.find(l => l.id === ligneId);
  if (!lg || typeof lg.dispo !== 'number') return '';
  // Si la commande ne sera pas comptée (date antérieure ou égale au dernier relevé PGM connu),
  // le disponible après envoi reste identique au disponible actuel.
  const apres = lg.dispo - dejaDA - (compte ? ajout : 0);
  const neg = apres < -0.005;
  const parts = String(lg.label).split('|');
  const nom = parts.length > 1 ? parts.slice(1).join('|').trim() : lg.label;
  const contrat = parts.length > 1 ? parts[0].trim() : '';
  return `
    <div class="dispo-info ${neg ? 'neg' : ''}">
      <div class="dispo-title">Ligne : ${edEsc(nom)}${contrat ? ' · ' + edEsc(contrat) : ''}</div>
      <div class="dispo-row"><span>Disponible actuel</span><span>${fmt(lg.dispo)}</span></div>
      ${dejaDA > 0.005 ? `<div class="dispo-row"><span>− Déjà dans cette DA</span><span>${fmt(dejaDA)}</span></div>` : ''}
      ${compte ? `<div class="dispo-row"><span>− ${edEsc(labelAjout || 'À ajouter')}</span><span>${fmt(ajout)}</span></div>` : ''}
      <div class="dispo-row dispo-res"><span>= Disponible après envoi de la DA</span><span>${fmt(neg ? apres : Math.max(apres, 0))}</span></div>
      ${neg ? '<div class="dispo-alert">⚠ Dépassement : le montant dépasse le disponible de la ligne.</div>' : ''}
      ${autresEnCours > 0.005 ? `<div class="dispo-hint">Non déduits : ${fmt(autresEnCours)} dans d'autres DA « En cours » de cette même ligne.</div>` : ''}
    </div>`;
}
function dispoInfoHtml(daId, ajout, labelAjout) {
  try {
    const da = daId ? das.find(x => x.id === Number(daId)) : null;
    if (!da || !da.ligne) return '';
    const deja = da.statut === 'En cours' ? totalOf(da.id) : 0;   // pas encore compté dans le « Disponible »
    return dispoInfoCore(da.ligne, deja, ajout, labelAjout, autresEnCoursLigne(da.ligne, da.id));
  } catch (e) { return ''; }
}
function updateSplitDispo(articleId) {
  const box = document.getElementById('split-dispo-' + articleId);
  if (!box) return;
  const daId = edVal('split-da-' + articleId);
  splitDAValue = daId;   // on mémorise le choix pour qu'il survive à un rafraîchissement
  const v = parseFloat(edVal('split-montant-' + articleId)) || 0;
  box.innerHTML = daId ? dispoInfoHtml(daId, v, 'À assigner') : '';
}

// ---------- Traçabilité des répartitions ----------
// La colonne « Repartition » (Text) de Commandes reçoit une clé commune aux parts d'un même article.
async function edEnsureRepartition() {
  try {
    const t = await grist.docApi.fetchTable('Commandes');
    if (Object.prototype.hasOwnProperty.call(t, 'Repartition')) return true;
    await grist.docApi.applyUserActions([['AddColumn', 'Commandes', 'Repartition', { type: 'Text', label: 'Répartition' }]]);
    return true;
  } catch (e) { return false; }   // sans traçabilité, la répartition fonctionne quand même
}
function repSiblings(a) { return a.rep ? commandes.filter(x => x.rep === a.rep && x.id !== a.id) : []; }
function repHtml(a) {
  try {
    const sib = repSiblings(a);
    if (!sib.length) return '';
    const ou = x => { const d = x.demande_achat ? das.find(y => y.id === x.demande_achat) : null; return (d ? edEsc(d.num_da) : 'libre') + ' (' + fmt(x.montant) + ')'; };
    return `<div class="art-rep">⚟ Répartie · autres parts : ${sib.map(ou).join(' · ')}
      <button class="btn-rep-merge" onclick="openEdit('merge',${a.id})">⟲ Regrouper</button></div>`;
  } catch (e) { return ''; }
}

function edOpenMerge(id) {
  const a = commandes.find(x => x.id === id);
  if (!a || !a.rep) throw new Error('Répartition introuvable.');
  edCtx = { kind: 'merge', id, orig: null, draft: {} };
  edRefresh();
}
function edMergeHtml() {
  const a = commandes.find(x => x.id === edCtx.id);
  if (!a || !a.rep) return '';
  const parts = commandes.filter(x => x.rep === a.rep).sort((p, q) => p.id - q.id);
  if (parts.length < 2) return '';
  const daDe = p => p.demande_achat ? das.find(y => y.id === p.demande_achat) : null;
  const verrou = parts.map(daDe).find(d => d && d.statut !== 'En cours');
  const hetero = parts.some(p => (p.qte || 1) !== (parts[0].qte || 1) || p.devise !== parts[0].devise || (p.taux || 1) !== (parts[0].taux || 1));
  const total = parts.reduce((t, p) => t + (p.montant || 0), 0);
  const memeDA = parts.every(p => p.demande_achat === parts[0].demande_achat);
  const dest = memeDA ? (daDe(parts[0]) ? 'dans la DA <b>' + edEsc(daDe(parts[0]).num_da) + '</b>' : 'article libre') : 'article libre (à réassigner ensuite à une DA)';
  const rows = parts.map(p => { const d = daDe(p); return `<tr><td>${d ? edEsc(d.num_da) + ' (' + edEsc(d.statut) + ')' : 'libre'}</td><td>${fmt(p.montant)}</td></tr>`; }).join('');
  const bloque = verrou ? `Impossible : une part est dans la DA « ${edEsc(verrou.num_da)} » déjà ${edEsc(verrou.statut)}.`
    : (hetero ? 'Impossible : les parts ont des quantités ou devises différentes.' : '');
  return `
    <div class="ed-inline" id="ed-panel">
      <div class="ed-inline-title">⟲ Regrouper les parts de « ${edEsc(a.designation || '(sans nom)')} » ?</div>
      <table class="ed-parts">${rows}<tr><td><b>Total</b></td><td><b>${fmt(total)}</b></td></tr></table>
      ${bloque ? `<div class="ed-warn">${bloque}</div>`
               : `<div>Les parts seront fusionnées en <b>un seul article de ${fmt(total)}</b>, ${dest}.</div>`}
      <div class="ed-inline-row">
        ${bloque ? '' : '<button class="ed-save" id="ed-save" onclick="edMerge()">Regrouper</button>'}
        <button class="btn-del-cancel" onclick="edClose()">${bloque ? 'Retour' : 'Annuler'}</button>
        <span class="ed-msg" id="ed-msg"></span>
      </div>
    </div>`;
}
async function edMerge() {
  if (!edCtx || edCtx.kind !== 'merge') return;
  const btn = document.getElementById('ed-save');
  try {
    const a0 = commandes.find(x => x.id === edCtx.id);
    if (!a0 || !a0.rep) throw new Error('Répartition introuvable.');
    const parts = commandes.filter(x => x.rep === a0.rep).sort((p, q) => p.id - q.id);
    if (parts.length < 2) throw new Error("Il n'y a qu'une seule part.");
    const bloque = parts.some(p => { const d = p.demande_achat ? das.find(y => y.id === p.demande_achat) : null; return d && d.statut !== 'En cours'; });
    if (bloque) throw new Error('Une part est dans une DA déjà envoyée.');
    const q0 = parts[0].qte || 1;
    if (parts.some(p => (p.qte || 1) !== q0 || p.devise !== parts[0].devise || (p.taux || 1) !== (parts[0].taux || 1))) throw new Error('Les parts ont des quantités ou devises différentes.');
    if (btn) btn.disabled = true;
    edMsg('Regroupement…', '');
    const keep = parts[0];
    const somme = parts.reduce((t, p) => t + (p.prix || 0), 0);
    const prixTotal = q0 === 1 ? Math.round(somme * 100) / 100 : Math.round(somme * 1e6) / 1e6;
    const memeDA = parts.every(p => p.demande_achat === keep.demande_achat);
    const actions = [['UpdateRecord', 'Commandes', keep.id, { Prix_unitaire_HT: prixTotal, Repartition: '', Demande_achat: memeDA ? (keep.demande_achat || null) : null }]];
    parts.slice(1).forEach(p => actions.push(['RemoveRecord', 'Commandes', p.id]));
    await grist.docApi.applyUserActions(actions);
    parts.slice(1).forEach(p => { selectedArts.delete(p.id); if (splitArticleId === p.id) splitArticleId = null; });
    edCtx = null;
    await fetchAll();
  } catch (e) {
    if (btn) btn.disabled = false;
    edMsg('Erreur : ' + e.message, 'err');
  }
}

// ---------- Nouvelle DA à partir des articles sélectionnés ----------
function edOpenNewDA() {
  const n = commandes.filter(c => !c.demande_achat && selectedArts.has(c.id)).length;
  if (!n) throw new Error("Sélectionnez d'abord au moins un article libre.");
  edCtx = { kind: 'newda', id: 0, orig: { num: nextNumDA(), date: new Date().toISOString().slice(0, 10) }, draft: {} };
  edRefresh();
}
function edNewDAHtml() {
  const o = edCtx.orig;
  const cVal = String(edDv('ed-nd-contrat', ''));
  const lVal = String(edDv('ed-nd-ligne', ''));
  const fVal = String(edDv('ed-nd-four', ''));
  const contratOpts = '<option value="">— Choisir —</option>' + contratsList.slice()
    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' }))
    .map(x => `<option value="${x.id}" ${String(x.id) === cVal ? 'selected' : ''}>${edEsc(x.nom)}</option>`).join('');
  const fourOpts = '<option value="">— Choisir —</option>' + fournisseursList.slice()
    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' }))
    .map(x => `<option value="${x.id}" ${String(x.id) === fVal ? 'selected' : ''}>${edEsc(x.nom)}</option>`).join('');
  const arts = commandes.filter(c => !c.demande_achat && selectedArts.has(c.id));
  const total = arts.reduce((t, a) => t + (a.montant || 0), 0);
  const lId = lVal ? Number(lVal) : null;
  return `
    <div class="ed-inline" id="ed-panel">
      <div class="ed-inline-title">＋ Nouvelle DA avec ${arts.length} article${arts.length > 1 ? 's' : ''} (${fmt(total)})</div>
      <div class="ed-grid">
        <div class="ed-field"><label>N° DA</label><input type="text" id="ed-nd-num" value="${edEsc(edDv('ed-nd-num', o.num))}"></div>
        <div class="ed-field"><label>Contrat</label><select id="ed-nd-contrat" onchange="edNdOnContrat()">${contratOpts}</select></div>
        <div class="ed-field"><label>Ligne budgétaire</label><select id="ed-nd-ligne" onchange="edNdUpdateDispo()">${edLigneOptions(cVal ? Number(cVal) : null, lId)}</select></div>
        <div class="ed-field"><label>Fournisseur</label><select id="ed-nd-four">${fourOpts}</select></div>
        <div class="ed-field"><label>Date DA</label><input type="date" id="ed-nd-date" value="${edEsc(edDv('ed-nd-date', o.date))}" onchange="edNdUpdateDispo()"></div>
      </div>
      <div id="ed-nd-dispo">${lId ? dispoInfoCore(lId, 0, total, 'À ajouter (sélection)', autresEnCoursLigne(lId, null), !estAvantRelevePgm(lId, edDv('ed-nd-date', o.date))) : ''}${dateAvantReleveHtml(lId, edDv('ed-nd-date', o.date))}</div>
      <div class="ed-inline-row">
        <button class="ed-save" id="ed-save" onclick="edCreateDA()">Créer la DA et assigner</button>
        <button class="btn-del-cancel" onclick="edClose()">Annuler</button>
        <span class="ed-msg" id="ed-msg"></span>
      </div>
    </div>`;
}
function edNdOnContrat() {
  if (!edCtx) return;
  const cid = edVal('ed-nd-contrat') ? Number(edVal('ed-nd-contrat')) : null;
  const sel = document.getElementById('ed-nd-ligne');
  if (sel) sel.innerHTML = edLigneOptions(cid, null);
  edCtx.draft['ed-nd-ligne'] = '';
  edNdUpdateDispo();
}
// Avertit que le disponible affiché ne bougera pas si la date choisie pour la DA
// est antérieure (ou égale) au dernier relevé PGM connu de la ligne.
function estAvantRelevePgm(ligneId, dateStr) {
  const lg = ligneId ? lignesList.find(l => l.id === ligneId) : null;
  if (!lg || !lg.date_dernier_releve || !dateStr) return false;
  const dateChoisie = edEpoch(dateStr);
  if (dateChoisie == null) return false;
  return dateChoisie <= toMs(lg.date_dernier_releve) / 1000;
}
function dateAvantReleveHtml(ligneId, dateStr) {
  if (!estAvantRelevePgm(ligneId, dateStr)) return '';
  const lg = lignesList.find(l => l.id === ligneId);
  const dateChoisie = edEpoch(dateStr);
  return `<div class="ed-warn">⚠ Cette date (${fmtDate(dateChoisie)}) est antérieure ou égale au dernier relevé PGM de cette ligne (${fmtDate(lg.date_dernier_releve)}) : le disponible affiché ne changera pas.</div>`;
}

function edNdUpdateDispo() {
  const box = document.getElementById('ed-nd-dispo');
  if (!box) return;
  const lId = edVal('ed-nd-ligne') ? Number(edVal('ed-nd-ligne')) : null;
  const dateVal = edVal('ed-nd-date');
  box.innerHTML = (lId ? dispoInfoCore(lId, 0, selSum(), 'À ajouter (sélection)', autresEnCoursLigne(lId, null), !estAvantRelevePgm(lId, dateVal)) : '')
    + dateAvantReleveHtml(lId, dateVal);
}
async function edCreateDA() {
  if (!edCtx || edCtx.kind !== 'newda') return;
  const btn = document.getElementById('ed-save');
  const num = edVal('ed-nd-num').trim();
  const contrat = edVal('ed-nd-contrat') ? Number(edVal('ed-nd-contrat')) : null;
  const ligne = edVal('ed-nd-ligne') ? Number(edVal('ed-nd-ligne')) : null;
  const four = edVal('ed-nd-four') ? Number(edVal('ed-nd-four')) : null;
  const dateVal = edVal('ed-nd-date');
  const ids = commandes.filter(c => !c.demande_achat && selectedArts.has(c.id)).map(c => c.id);
  if (!num || !contrat || !ligne || !four) { edMsg('N° DA, contrat, ligne et fournisseur sont obligatoires.', 'err'); return; }
  if (!ids.length) { edMsg('Aucun article libre sélectionné.', 'err'); return; }
  if (das.some(d => d.statut !== 'Annulée' && String(d.num_da).trim() === num)) { edMsg('Ce N° DA existe déjà.', 'err'); return; }
  let newId = null;
  try {
    if (btn) btn.disabled = true;
    edMsg('Création de la DA…', '');
    const res = await grist.docApi.applyUserActions([
      ['AddRecord', 'Demandes_achat', null, { Num_DA: num, Contrat: contrat, Ligne_budgetaire: ligne, Fournisseur: four, Date_DA: edEpoch(dateVal), Statut: 'En cours' }]
    ]);
    newId = res && res.retValues && typeof res.retValues[0] === 'number' ? res.retValues[0] : null;
    if (!newId) {   // repli : retrouver la DA créée par son numéro
      const t = await grist.docApi.fetchTable('Demandes_achat');
      for (let i = (t.id || []).length - 1; i >= 0; i--) { if (String((t.Num_DA || [])[i]).trim() === num) { newId = t.id[i]; break; } }
    }
    if (!newId) throw new Error("DA créée, mais introuvable pour l'assignation : assignez les articles manuellement.");
    edMsg('Assignation des articles…', '');
    await grist.docApi.applyUserActions([
      ['BulkUpdateRecord', 'Commandes', ids, { Demande_achat: ids.map(() => newId) }]
    ]);
    selectedArts.clear();
    assignDAValue = '';
    edCtx = null;
    tab = 'En cours';
    selectedDA = newId;
    await fetchAll();
  } catch (e) {
    if (btn) btn.disabled = false;
    edMsg('Erreur : ' + e.message + (newId ? ' (la DA ' + num + ' a été créée)' : ''), 'err');
  }
}

// ---------- Catégorie (ligne budgétaire) d'une DA, pour l'en-tête du détail ----------
function daCategorieHtml(d) {
  try {
    const lg = d.ligne ? lignesList.find(l => l.id === d.ligne) : null;
    if (!lg) return '';
    const parts = String(lg.label).split('|');
    const sub = (parts.length > 1 ? parts.slice(1).join('|') : lg.label).trim();
    if (!sub) return '';
    const COUL = { 'Fonctionnement': '#378ADD', 'Équipement': '#D97B3F', 'Personnel': '#9C6ADE', 'Prestation': '#1D9E75', 'Mission': '#BA9517' };
    const cat = Object.keys(COUL).find(k => sub.includes(k));
    const pastille = cat ? `<span style="display:inline-block; width:8px; height:8px; border-radius:2px; background:${COUL[cat]}; margin-right:6px;"></span>` : '';
    return `<div class="detail-cat" style="font-size:12.5px; margin-top:3px;">${pastille}${edEsc(sub)}</div>`;
  } catch (e) { return ''; }
}

function loadData() {
  if (window.grist) {
    grist.ready({ requiredAccess: 'full' });
    fetchAll();
    grist.onRecords(() => { if (tab !== 'nouvelle' && !document.getElementById('ed-panel')) fetchAll(); });
    window.addEventListener('focus', () => { if (tab !== 'nouvelle' && !document.getElementById('ed-panel')) fetchAll(); });
  } else {
    document.getElementById('container').innerHTML = '<div class="empty">Connectez à Grist.</div>';
  }
}
const s = document.createElement('script');
s.src='https://docs.getgrist.com/grist-plugin-api.js';
s.onload=loadData; s.onerror=loadData;
document.head.appendChild(s);
</script>
</body>
</html>
